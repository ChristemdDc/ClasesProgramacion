MOD({
  id: "m3", n: 3, title: "Organizar datos y código", lang: "pseudo",
  desc: "Arreglos, texto, funciones y los algoritmos clásicos de búsqueda y ordenamiento.",
  lessons: ["l10", "l11", "l12", "l13"],
  exam: {
    extra: [
      { q: "Con <code>Dimension v[6]</code>, ¿cuál es la última posición válida?", opts: ["6", "5", "7", "0"], a: 1, why: "Las posiciones van de 0 a 5 (6 posiciones en total)." },
      { q: "¿Qué muestra?", code: "Dimension v[3]\nv[0] <- 4\nv[1] <- v[0] * 2\nv[2] <- v[0] + v[1]\nEscribir v[2]", opts: ["4", "8", "12", "6"], a: 2, why: "v[0]=4, v[1]=8, v[2]=4+8=12." },
      { q: "¿Qué devuelve <code>Longitud(\"Hola mundo\")</code>?", opts: ["9", "10", "2", "11"], a: 1, why: "Cuenta todos los caracteres, el espacio incluido: 10." },
      { q: "¿Cuál es la principal ventaja de usar funciones?", opts: ["El programa corre más rápido", "Reutilizar código y dividir el problema en partes", "No hace falta usar variables", "Evitan todos los errores"], a: 1, why: "Escribes una vez, usas muchas, y cada parte se entiende por separado." },
      { q: "¿Qué muestra?", code: "Funcion r <- triple(x)\n\tr <- x * 3\nFinFuncion\nAlgoritmo P\n\tEscribir triple(triple(2))\nFinAlgoritmo", opts: ["6", "9", "18", "12"], a: 2, why: "triple(2)=6 y triple(6)=18." },
      { q: "La búsqueda binaria requiere que la lista esté...", opts: ["Vacía", "Ordenada", "Con números pares", "Al revés"], a: 1, why: "Descarta la mitad en cada paso comparando con el medio; solo funciona si está ordenada." },
      { q: "En el ordenamiento burbuja, ¿qué se hace cuando dos elementos vecinos están en el orden incorrecto?", opts: ["Se borran", "Se intercambian", "Se suman", "Se termina el algoritmo"], a: 1, why: "Se intercambian, y así los mayores van «flotando» al final." },
      { q: "Una variable creada dentro de una función...", opts: ["Se puede usar en todo el programa", "Solo existe dentro de esa función", "Se guarda para siempre", "Es siempre de tipo Cadena"], a: 1, why: "Es una variable local: su ámbito es la función." },
      { fill: true, q: "¿Qué devuelve <code>Subcadena(\"programa\", 0, 3)</code>?", a: ["prog"], why: "Desde la posición 0 hasta la 3 inclusive: p-r-o-g." },
      { q: "Para recorrer todas las posiciones de <code>Dimension notas[n]</code> usas...", opts: ["Para i <- 1 Hasta n", "Para i <- 0 Hasta n - 1", "Para i <- 0 Hasta n", "Para i <- n Hasta n"], a: 1, why: "Las posiciones van de 0 a n-1." },
    ],
    challenge: {
      id: "ex_m3", title: "Estadísticas de una lista",
      text: "Lee N y luego N números enteros en un arreglo. Escribe una función <code>Promedio</code> y muestra como últimas dos líneas:<br><code>Promedio: X</code><br><code>Mayores al promedio: K</code><br>donde K es cuántos números superan el promedio.",
      lang: "pseudo",
      starter: "Funcion p <- Promedio(v, n)\n\t// completa\nFinFuncion\n\nAlgoritmo Estadisticas\n\tDefinir n Como Entero\n\tLeer n\n\tDimension datos[n]\n\t\nFinAlgoritmo",
      tests: [{ in: ["4", "2", "4", "6", "8"], out: "Promedio: 5\nMayores al promedio: 2" }, { in: ["3", "10", "10", "10"], out: "Promedio: 10\nMayores al promedio: 0" }, { in: ["5", "1", "2", "3", "4", "100"], out: "Promedio: 22\nMayores al promedio: 1" }],
      hint: "La función suma v[0] a v[n-1] y divide entre n. En el algoritmo, guarda el promedio en una variable y recorre de nuevo el arreglo contando.",
      solution: 'Funcion p <- Promedio(v, n)\n\tsuma <- 0\n\tPara i <- 0 Hasta n - 1 Hacer\n\t\tsuma <- suma + v[i]\n\tFinPara\n\tp <- suma / n\nFinFuncion\n\nAlgoritmo Estadisticas\n\tDefinir n Como Entero\n\tLeer n\n\tDimension datos[n]\n\tPara i <- 0 Hasta n - 1 Hacer\n\t\tLeer datos[i]\n\tFinPara\n\tprom <- Promedio(datos, n)\n\tc <- 0\n\tPara i <- 0 Hasta n - 1 Hacer\n\t\tSi datos[i] > prom Entonces\n\t\t\tc <- c + 1\n\t\tFinSi\n\tFinPara\n\tEscribir "Promedio: ", prom\n\tEscribir "Mayores al promedio: ", c\nFinAlgoritmo'
    }
  }
});

L({
  id: "l10", module: "m3", title: "Arreglos (vectores y matrices)", minutes: 40,
  summary: "Guardar muchos valores bajo un mismo nombre y recorrerlos con bucles.",
  sections: [
    { h: "El problema", body: `
<p>Si quieres guardar las notas de 30 alumnos, ¿crearías 30 variables (<code>nota1</code>, <code>nota2</code>...)? Sería imposible de manejar. Un <b>arreglo</b> (también llamado vector, array o lista) guarda <b>muchos valores bajo un solo nombre</b>, cada uno en una posición numerada.</p>
${IDEA("Un arreglo es como una fila de casilleros numerados. Todos se llaman <code>notas</code>, y para elegir uno dices su número: <code>notas[0]</code>, <code>notas[1]</code>...")}
${C(`Algoritmo PrimerArreglo
	Dimension notas[4]
	notas[0] <- 7
	notas[1] <- 9
	notas[2] <- 5
	notas[3] <- 10
	Escribir "La segunda nota es ", notas[1]
	Escribir notas
FinAlgoritmo`)}
<p><code>Dimension notas[4]</code> crea un arreglo de 4 posiciones. El número entre corchetes al usarlo se llama <b>índice</b>.</p>
${WARN("Las posiciones empiezan en <b>0</b>. Un arreglo de 4 posiciones tiene los índices 0, 1, 2 y 3. Así funcionan JavaScript, Python, Java, C y casi todos los lenguajes. (En PSeInt, según la configuración, pueden empezar en 1; en esta app siempre empiezan en 0 para que te acostumbres a lo que usarás después).")}
<p>Si usas un índice que no existe, obtienes un error. Pruébalo:</p>
${C(`Algoritmo FueraDeRango
	Dimension v[3]
	v[3] <- 1
FinAlgoritmo`)}` },
    { h: "Recorrer un arreglo con Para", body: `
<p>La combinación más poderosa: un arreglo y un bucle Para que pase por todas sus posiciones. El índice deja de ser un número fijo y pasa a ser la variable del bucle:</p>
${C(`Algoritmo CargarYMostrar
	Definir n Como Entero
	n <- 5
	Dimension cuadrados[n]
	// Cargar
	Para i <- 0 Hasta n - 1 Hacer
		cuadrados[i] <- i * i
	FinPara
	// Mostrar
	Para i <- 0 Hasta n - 1 Hacer
		Escribir "Posición ", i, ": ", cuadrados[i]
	FinPara
FinAlgoritmo`)}
<p>Observa el <code>Hasta n - 1</code>: con n = 5 las posiciones van de 0 a 4.</p>` },
    { h: "Operaciones típicas", body: `
<p>Todos los patrones que aprendiste (acumulador, contador, máximo) funcionan con arreglos:</p>
${C(`Algoritmo Operaciones
	Dimension precios[5]
	precios[0] <- 120
	precios[1] <- 85
	precios[2] <- 300
	precios[3] <- 45
	precios[4] <- 210

	total <- 0
	caro <- precios[0]
	baratos <- 0
	Para i <- 0 Hasta 4 Hacer
		total <- total + precios[i]
		Si precios[i] > caro Entonces
			caro <- precios[i]
		FinSi
		Si precios[i] < 100 Entonces
			baratos <- baratos + 1
		FinSi
	FinPara
	Escribir "Total: ", total
	Escribir "Promedio: ", total / 5
	Escribir "Más caro: ", caro
	Escribir "Cuestan menos de 100: ", baratos
FinAlgoritmo`)}
<p><b>Buscar un elemento:</b> recorre y compara, usando una bandera o guardando la posición:</p>
${C(`Algoritmo Buscar
	Dimension nombres[4]
	nombres[0] <- "Ana"
	nombres[1] <- "Luis"
	nombres[2] <- "Sofía"
	nombres[3] <- "Pedro"
	buscado <- "Sofía"
	posicion <- -1
	Para i <- 0 Hasta 3 Hacer
		Si nombres[i] = buscado Entonces
			posicion <- i
		FinSi
	FinPara
	Si posicion = -1 Entonces
		Escribir buscado, " no está"
	SiNo
		Escribir buscado, " está en la posición ", posicion
	FinSi
FinAlgoritmo`)}
${TIP("Usar <code>-1</code> para indicar «no encontrado» es una convención muy común. En JavaScript, <code>indexOf</code> devuelve exactamente -1 cuando no encuentra algo.")}` },
    { h: "Matrices: arreglos de dos dimensiones", body: `
<p>Una <b>matriz</b> es una tabla con filas y columnas. Se crea con dos tamaños y se accede con dos índices: <code>[fila, columna]</code>. Se recorre con dos bucles anidados.</p>
${C(`Algoritmo Matriz
	Dimension m[3, 4]
	// Llenar: cada celda = fila * 10 + columna
	Para f <- 0 Hasta 2 Hacer
		Para c <- 0 Hasta 3 Hacer
			m[f, c] <- f * 10 + c
		FinPara
	FinPara
	// Mostrar como tabla
	Para f <- 0 Hasta 2 Hacer
		Para c <- 0 Hasta 3 Hacer
			Escribir Sin Saltar m[f, c], "	"
		FinPara
		Escribir ""
	FinPara
FinAlgoritmo`)}
${PRO("Las matrices aparecen en tableros de juegos (ta-te-ti, ajedrez), hojas de cálculo e imágenes digitales, que son matrices de píxeles. En JavaScript una matriz se escribe como un arreglo de arreglos: <code>m[f][c]</code>.")}` },
  ],
  cheat: [
    { h: "Crear y usar", body: CN(`Dimension v[5]        // posiciones 0 a 4
v[0] <- 10
Escribir v[0]
Dimension m[3, 3]     // matriz 3x3
m[1, 2] <- 7`) },
    { h: "Recorrer", body: CN(`Para i <- 0 Hasta n - 1 Hacer
	Escribir v[i]
FinPara`) },
    { h: "Buscar", body: CN(`pos <- -1
Para i <- 0 Hasta n - 1 Hacer
	Si v[i] = buscado Entonces
		pos <- i
	FinSi
FinPara`) },
    { h: "Recuerda", body: `<ul><li>Índices desde <b>0</b> hasta <b>tamaño − 1</b>.</li><li>Índice fuera de rango = error.</li><li>Matriz: dos índices y dos bucles anidados.</li></ul>` },
  ],
  quiz: [
    { q: "Con <code>Dimension datos[10]</code>, ¿cuántos valores puede guardar?", opts: ["9", "10", "11", "Ilimitados"], a: 1, why: "10 posiciones, de la 0 a la 9." },
    { q: "¿Qué muestra?", code: "Dimension v[3]\nv[0] <- 5\nv[1] <- 3\nv[2] <- v[0] - v[1]\nEscribir v[2]", opts: ["5", "3", "2", "8"], a: 2, why: "v[2] = 5 - 3 = 2." },
    { q: "¿Qué ocurre con <code>v[5] &lt;- 1</code> si <code>v</code> tiene 5 posiciones?", opts: ["Guarda en la última posición", "Error: índice fuera de rango", "Agranda el arreglo", "Nada"], a: 1, why: "Las posiciones válidas son 0..4." },
    { q: "¿Qué muestra?", code: "Dimension v[4]\nPara i <- 0 Hasta 3 Hacer\n\tv[i] <- i * 2\nFinPara\nEscribir v[3]", opts: ["3", "6", "8", "4"], a: 1, why: "v[3] = 3 * 2 = 6." },
    { q: "En <code>m[2, 1]</code>, ¿qué indica el 2?", opts: ["La columna", "La fila", "El valor", "El tamaño"], a: 1, why: "Por convención, primero la fila y luego la columna." },
    { q: "¿Para qué sirve guardar <code>posicion &lt;- -1</code> antes de buscar?", opts: ["Para que el bucle empiece al revés", "Para indicar «no encontrado» si nunca se cambia", "Para borrar el arreglo", "No sirve"], a: 1, why: "-1 no es una posición válida, así que si sigue en -1 sabes que no se encontró." },
  ],
  exercises: [
    { id: "ex10a", title: "Al revés", lang: "pseudo",
      text: "Lee 5 números en un arreglo y muéstralos en orden inverso, uno por línea.",
      starter: "Algoritmo AlReves\n\tDimension v[5]\n\t\nFinAlgoritmo",
      tests: [{ in: ["1", "2", "3", "4", "5"], out: "5\n4\n3\n2\n1" }, { in: ["9", "0", "7", "3", "8"], out: "8\n3\n7\n0\n9" }],
      hint: "Carga con Para i <- 0 Hasta 4, y muestra con Para i <- 4 Hasta 0 Con Paso -1.",
      solution: 'Algoritmo AlReves\n\tDimension v[5]\n\tPara i <- 0 Hasta 4 Hacer\n\t\tLeer v[i]\n\tFinPara\n\tPara i <- 4 Hasta 0 Con Paso -1 Hacer\n\t\tEscribir v[i]\n\tFinPara\nFinAlgoritmo' },
    { id: "ex10b", title: "¿Cuántas veces aparece?", lang: "pseudo",
      text: "Lee 6 números en un arreglo y después un número a buscar. Muestra como última línea <code>Aparece K veces</code>.",
      starter: "Algoritmo Apariciones\n\tDimension v[6]\n\t\nFinAlgoritmo",
      tests: [{ in: ["3", "1", "3", "7", "3", "2", "3"], out: "Aparece 3 veces" }, { in: ["1", "2", "3", "4", "5", "6", "9"], out: "Aparece 0 veces" }],
      hint: "Primero un Para para leer. Luego Leer buscado. Luego otro Para con un contador.",
      solution: 'Algoritmo Apariciones\n\tDimension v[6]\n\tPara i <- 0 Hasta 5 Hacer\n\t\tLeer v[i]\n\tFinPara\n\tLeer buscado\n\tc <- 0\n\tPara i <- 0 Hasta 5 Hacer\n\t\tSi v[i] = buscado Entonces\n\t\t\tc <- c + 1\n\t\tFinSi\n\tFinPara\n\tEscribir "Aparece ", c, " veces"\nFinAlgoritmo' },
    { id: "ex10c", title: "Suma de una matriz", lang: "pseudo",
      text: "Lee una matriz de 2 filas y 3 columnas (6 números, fila por fila). Muestra la suma de cada fila con el formato <code>Fila 0: X</code> y <code>Fila 1: Y</code>.",
      starter: "Algoritmo SumaFilas\n\tDimension m[2, 3]\n\t\nFinAlgoritmo",
      tests: [{ in: ["1", "2", "3", "4", "5", "6"], out: "Fila 0: 6\nFila 1: 15" }, { in: ["0", "0", "1", "10", "10", "10"], out: "Fila 0: 1\nFila 1: 30" }],
      hint: "Dos Para anidados para leer. Para sumar: por cada fila, un acumulador que empieza en 0 y recorre las columnas.",
      solution: 'Algoritmo SumaFilas\n\tDimension m[2, 3]\n\tPara f <- 0 Hasta 1 Hacer\n\t\tPara c <- 0 Hasta 2 Hacer\n\t\t\tLeer m[f, c]\n\t\tFinPara\n\tFinPara\n\tPara f <- 0 Hasta 1 Hacer\n\t\ts <- 0\n\t\tPara c <- 0 Hasta 2 Hacer\n\t\t\ts <- s + m[f, c]\n\t\tFinPara\n\t\tEscribir "Fila ", f, ": ", s\n\tFinPara\nFinAlgoritmo' },
  ]
});

L({
  id: "l11", module: "m3", title: "Trabajar con texto", minutes: 30,
  summary: "Longitud, extraer partes, mayúsculas y recorrer un texto letra por letra.",
  sections: [
    { h: "Un texto es una secuencia de caracteres", body: `
<p>Una cadena como <code>"Hola"</code> es una fila de <b>caracteres</b> (letras, números, espacios, signos), cada uno en una posición, empezando en 0. Se parece mucho a un arreglo.</p>
${TABLE(["Posición", "0", "1", "2", "3"], [["Carácter", "H", "o", "l", "a"]])}
<p>Funciones disponibles:</p>
${TABLE(["Función", "Qué hace", "Ejemplo → resultado"], [["<code>Longitud(t)</code>", "Cantidad de caracteres", "<code>Longitud(\"Hola\")</code> → 4"], ["<code>Subcadena(t, desde, hasta)</code>", "Parte del texto (ambas posiciones incluidas)", "<code>Subcadena(\"Hola\", 1, 2)</code> → \"ol\""], ["<code>Mayusculas(t)</code>", "Todo en mayúsculas", "→ \"HOLA\""], ["<code>Minusculas(t)</code>", "Todo en minúsculas", "→ \"hola\""], ["<code>ConvertirANumero(t)</code>", "Texto a número", "<code>\"42\"</code> → 42"], ["<code>ConvertirATexto(n)</code>", "Número a texto", "42 → <code>\"42\"</code>"]])}
${C(`Algoritmo Funciones
	t <- "Programar"
	Escribir Longitud(t)
	Escribir Mayusculas(t)
	Escribir Subcadena(t, 0, 2)
	Escribir "Primera letra: ", Subcadena(t, 0, 0)
	Escribir "Última letra: ", Subcadena(t, Longitud(t) - 1, Longitud(t) - 1)
FinAlgoritmo`)}` },
    { h: "Recorrer un texto letra por letra", body: `
<p>Con un Para de 0 a <code>Longitud(t) - 1</code> y <code>Subcadena(t, i, i)</code> obtienes cada letra:</p>
${C(`Algoritmo ContarVocales
	Definir frase, letra Como Cadena
	frase <- "Aprender a programar"
	vocales <- 0
	Para i <- 0 Hasta Longitud(frase) - 1 Hacer
		letra <- Minusculas(Subcadena(frase, i, i))
		Si letra = "a" O letra = "e" O letra = "i" O letra = "o" O letra = "u" Entonces
			vocales <- vocales + 1
		FinSi
	FinPara
	Escribir "La frase tiene ", vocales, " vocales"
FinAlgoritmo`)}
<p>Fíjate en el truco: pasamos cada letra a minúsculas antes de comparar, así cuenta «A» y «a» por igual.</p>` },
    { h: "Construir textos nuevos", body: `
<p>Puedes armar un texto nuevo agregando partes con <code>+</code>. Por ejemplo, invertir una palabra:</p>
${C(`Algoritmo Invertir
	Definir palabra, invertida Como Cadena
	palabra <- "reconocer"
	invertida <- ""
	Para i <- Longitud(palabra) - 1 Hasta 0 Con Paso -1 Hacer
		invertida <- invertida + Subcadena(palabra, i, i)
	FinPara
	Escribir invertida
	Si invertida = palabra Entonces
		Escribir "¡Es un palíndromo!"
	FinSi
FinAlgoritmo`)}
<p>El texto vacío <code>""</code> es el «cero» de los textos: el valor inicial de un acumulador de texto.</p>
${PRO("Validar y transformar texto es parte del día a día: comprobar que un email tenga @, normalizar nombres, formatear números de teléfono. En JavaScript tendrás métodos como <code>.length</code>, <code>.slice()</code>, <code>.toUpperCase()</code> e <code>.includes()</code>, que son los mismos conceptos.")}` },
  ],
  cheat: [
    { h: "Funciones de texto", body: CN(`Longitud("Hola")            // 4
Subcadena("Hola", 1, 2)     // "ol"
Mayusculas("Hola")          // "HOLA"
Minusculas("Hola")          // "hola"
ConvertirANumero("42")      // 42
ConvertirATexto(42)         // "42"`) },
    { h: "Recorrer letras", body: CN(`Para i <- 0 Hasta Longitud(t) - 1 Hacer
	letra <- Subcadena(t, i, i)
FinPara`) },
    { h: "Recuerda", body: `<ul><li>Posiciones desde 0.</li><li>Mayúsculas y minúsculas son distintas al comparar.</li><li><code>\"\"</code> es el texto vacío.</li></ul>` },
  ],
  quiz: [
    { q: "¿Qué devuelve <code>Longitud(\"Sol y mar\")</code>?", opts: ["7", "9", "3", "8"], a: 1, why: "S-o-l-espacio-y-espacio-m-a-r: 9 caracteres." },
    { q: "¿Qué devuelve <code>Subcadena(\"computadora\", 3, 5)</code>?", opts: ["put", "mpu", "puta", "omp"], a: 0, why: "Posiciones 3, 4 y 5: p, u, t." },
    { q: "¿Qué da <code>\"Hola\" = \"hola\"</code>?", opts: ["VERDADERO", "FALSO", "Error", "4"], a: 1, why: "Las mayúsculas cuentan: H y h son caracteres distintos." },
    { q: "¿Cómo obtienes la primera letra de <code>nombre</code>?", opts: ["Subcadena(nombre, 1, 1)", "Subcadena(nombre, 0, 0)", "nombre[1]", "Longitud(nombre)"], a: 1, why: "La primera letra está en la posición 0." },
    { q: "¿Qué muestra?", code: 'r <- ""\nPara i <- 1 Hasta 3 Hacer\n\tr <- r + "ab"\nFinPara\nEscribir r', opts: ["ab", "ababab", "3ab", "ab3"], a: 1, why: "Se agrega \"ab\" tres veces al texto." },
  ],
  exercises: [
    { id: "ex11a", title: "Iniciales", lang: "pseudo",
      text: "Lee un nombre y un apellido y muestra sus iniciales en mayúsculas seguidas de punto. Ejemplo: <i>ada</i>, <i>lovelace</i> → <code>A.L.</code>",
      starter: "Algoritmo Iniciales\n\tDefinir nombre, apellido Como Cadena\n\t\nFinAlgoritmo",
      tests: [{ in: ["ada", "lovelace"], out: "A.L." }, { in: ["Grace", "Hopper"], out: "G.H." }],
      hint: "Mayusculas(Subcadena(nombre, 0, 0)) + \".\" + ...",
      solution: 'Algoritmo Iniciales\n\tDefinir nombre, apellido Como Cadena\n\tLeer nombre\n\tLeer apellido\n\tEscribir Mayusculas(Subcadena(nombre, 0, 0)), ".", Mayusculas(Subcadena(apellido, 0, 0)), "."\nFinAlgoritmo' },
    { id: "ex11b", title: "Contar una letra", lang: "pseudo",
      text: "Lee una frase y una letra. Muestra como última línea cuántas veces aparece la letra en la frase (sin distinguir mayúsculas de minúsculas).",
      starter: "Algoritmo ContarLetra\n\tDefinir frase, letra Como Cadena\n\t\nFinAlgoritmo",
      tests: [{ in: ["Banana", "a"], out: "3" }, { in: ["Hola Mundo", "O"], out: "2" }, { in: ["xyz", "a"], out: "0" }],
      hint: "Pasa la letra y cada carácter de la frase a minúsculas antes de comparar.",
      solution: 'Algoritmo ContarLetra\n\tDefinir frase, letra Como Cadena\n\tLeer frase\n\tLeer letra\n\tc <- 0\n\tPara i <- 0 Hasta Longitud(frase) - 1 Hacer\n\t\tSi Minusculas(Subcadena(frase, i, i)) = Minusculas(letra) Entonces\n\t\t\tc <- c + 1\n\t\tFinSi\n\tFinPara\n\tEscribir c\nFinAlgoritmo' },
    { id: "ex11c", title: "¿Palíndromo?", lang: "pseudo",
      text: "Lee una palabra y muestra <code>Palíndromo</code> si se lee igual al derecho y al revés (sin importar mayúsculas), o <code>No es palíndromo</code>.",
      starter: "Algoritmo Palindromo\n\tDefinir p, inv Como Cadena\n\t\nFinAlgoritmo",
      tests: [{ in: ["Neuquen"], out: "Palíndromo" }, { in: ["casa"], out: "No es palíndromo" }, { in: ["oso"], out: "Palíndromo" }],
      hint: "Construye la palabra invertida y compara ambas en minúsculas.",
      solution: 'Algoritmo Palindromo\n\tDefinir p, inv Como Cadena\n\tLeer p\n\tp <- Minusculas(p)\n\tinv <- ""\n\tPara i <- Longitud(p) - 1 Hasta 0 Con Paso -1 Hacer\n\t\tinv <- inv + Subcadena(p, i, i)\n\tFinPara\n\tSi inv = p Entonces\n\t\tEscribir "Palíndromo"\n\tSiNo\n\t\tEscribir "No es palíndromo"\n\tFinSi\nFinAlgoritmo' },
  ]
});

L({
  id: "l12", module: "m3", title: "Funciones y subprocesos", minutes: 40,
  summary: "Dividir un programa en piezas reutilizables con nombre, parámetros y resultado.",
  sections: [
    { h: "¿Qué es una función?", body: `
<p>Una <b>función</b> es un bloque de código con nombre que hace una tarea concreta. La defines una vez y la <b>llamas</b> (la usas) las veces que quieras. Ya usaste funciones que vienen incluidas: <code>raiz()</code>, <code>Longitud()</code>... Ahora vas a crear las tuyas.</p>
${IDEA("Una función es como una máquina: le das ingredientes (<b>parámetros</b>), hace su trabajo y te devuelve un producto (<b>valor de retorno</b>). No necesitas saber cómo funciona por dentro para usarla, igual que no necesitas saber cómo funciona una licuadora.")}
${C(`Funcion resultado <- Cuadrado(n)
	resultado <- n * n
FinFuncion

Algoritmo UsarFuncion
	Escribir Cuadrado(4)
	Escribir Cuadrado(9)
	x <- Cuadrado(3) + Cuadrado(4)
	Escribir x
FinAlgoritmo`)}
<ul><li><code>Funcion resultado &lt;- Cuadrado(n)</code>: se llama <b>Cuadrado</b>, recibe un dato <b>n</b> y lo que valga <b>resultado</b> al final es lo que devuelve.</li><li>Las funciones se escriben <b>fuera</b> del Algoritmo (antes o después).</li><li>También puedes devolver con <code>Retornar valor</code>, que termina la función en ese momento.</li></ul>` },
    { h: "Parámetros: los datos de entrada", body: `
<p>Una función puede recibir varios parámetros, separados por comas. Al llamarla, pasas los valores en el mismo orden:</p>
${C(`Funcion r <- AreaRectangulo(base, altura)
	r <- base * altura
FinFuncion

Funcion r <- Maximo(a, b)
	Si a > b Entonces
		r <- a
	SiNo
		r <- b
	FinSi
FinFuncion

Algoritmo Parametros
	Escribir "Área: ", AreaRectangulo(5, 3)
	Escribir "Máximo: ", Maximo(12, 30)
	// Puedes combinar llamadas
	Escribir "Máximo de tres: ", Maximo(Maximo(4, 17), 9)
FinAlgoritmo`)}` },
    { h: "Subprocesos: funciones que no devuelven nada", body: `
<p>A veces una función solo <b>hace algo</b> (mostrar un mensaje, dibujar) sin devolver un valor. Se llama <b>subproceso</b> o procedimiento. Se define sin la parte <code>resultado &lt;-</code> y se llama como una instrucción:</p>
${C(`SubProceso Linea(largo)
	Para i <- 1 Hasta largo Hacer
		Escribir Sin Saltar "="
	FinPara
	Escribir ""
FinSubProceso

SubProceso Titulo(texto)
	Linea(Longitud(texto))
	Escribir Mayusculas(texto)
	Linea(Longitud(texto))
FinSubProceso

Algoritmo Subprocesos
	Titulo("Menú principal")
	Escribir "1) Jugar"
	Escribir "2) Salir"
FinAlgoritmo`)}` },
    { h: "Ámbito: cada función tiene sus propias variables", body: `
<p>Las variables creadas dentro de una función son <b>locales</b>: solo existen ahí adentro. La función no puede ver las variables del algoritmo principal y viceversa. Lo único que entra son los parámetros y lo único que sale es el resultado.</p>
${C(`Funcion r <- Doble(n)
	temporal <- n * 2
	r <- temporal
FinFuncion

Algoritmo Ambito
	Escribir Doble(5)
	Escribir temporal
FinAlgoritmo`)}
<p>El segundo <code>Escribir</code> da error porque <code>temporal</code> solo existió dentro de <code>Doble</code>. Esto es algo <b>bueno</b>: cada función es independiente y no puede romper accidentalmente las variables de otra parte del programa.</p>
${TIP("<b>Por Referencia</b>: si quieres que una función pueda modificar una variable de quien la llama, declara el parámetro así: <code>Funcion Intercambiar(a Por Referencia, b Por Referencia)</code>. Los arreglos siempre se comparten (se pasan por referencia).")}` },
    { h: "¿Por qué usar funciones?", body: `
<ul><li><b>No repetir código.</b> Si algo se hace en tres lugares, escríbelo una vez como función. Si hay que corregirlo, se corrige en un solo lugar. (Principio DRY: <i>Don't Repeat Yourself</i>).</li><li><b>Dividir problemas grandes.</b> Un problema enorme se vuelve varios problemas pequeños, cada uno con un nombre claro.</li><li><b>Probar por partes.</b> Puedes verificar que cada función funciona sola.</li><li><b>Leer mejor.</b> <code>Si EsPrimo(n) Entonces</code> se entiende sin leer cómo está hecho.</li></ul>
${C(`Funcion r <- EsPrimo(n)
	r <- n > 1
	d <- 2
	Mientras d * d <= n Y r Hacer
		Si n MOD d = 0 Entonces
			r <- Falso
		FinSi
		d <- d + 1
	FinMientras
FinFuncion

Algoritmo PrimosHasta50
	Para i <- 1 Hasta 50 Hacer
		Si EsPrimo(i) Entonces
			Escribir Sin Saltar i, " "
		FinSi
	FinPara
	Escribir ""
FinAlgoritmo`)}
${PRO("En el trabajo real, el código se organiza casi todo en funciones pequeñas con nombres que explican qué hacen. Una regla práctica: si una función no entra en la pantalla, probablemente hace demasiadas cosas y conviene dividirla.")}` },
  ],
  cheat: [
    { h: "Función que devuelve", body: CN(`Funcion r <- Sumar(a, b)
	r <- a + b
FinFuncion

// o con Retornar:
Funcion Sumar(a, b)
	Retornar a + b
FinFuncion`) },
    { h: "Subproceso (no devuelve)", body: CN(`SubProceso Saludar(nombre)
	Escribir "Hola ", nombre
FinSubProceso

// llamada:
Saludar("Ana")`) },
    { h: "Recuerda", body: `<ul><li>Se definen fuera del Algoritmo.</li><li>Los parámetros se pasan en orden.</li><li>Variables internas = <b>locales</b>.</li><li><code>Por Referencia</code> permite modificar la variable original.</li><li>Una función = una tarea, con nombre claro.</li></ul>` },
  ],
  quiz: [
    { q: "¿Qué muestra?", code: "Funcion r <- Sumar1(x)\n\tr <- x + 1\nFinFuncion\nAlgoritmo A\n\tEscribir Sumar1(Sumar1(5))\nFinAlgoritmo", opts: ["6", "7", "5", "11"], a: 1, why: "Sumar1(5)=6, Sumar1(6)=7." },
    { q: "¿Cuál es la diferencia entre una función y un subproceso?", opts: ["No hay diferencia", "La función devuelve un valor; el subproceso solo realiza acciones", "El subproceso es más rápido", "La función no tiene parámetros"], a: 1, why: "Un subproceso hace algo pero no devuelve un resultado para usar en una expresión." },
    { q: "Si una función define <code>total &lt;- 0</code> dentro, ¿se puede usar <code>total</code> en el Algoritmo principal?", opts: ["Sí", "No, es una variable local", "Solo si es Entero", "Solo después de llamarla"], a: 1, why: "Las variables locales solo existen dentro de su función." },
    { q: "¿Qué recibe <code>a</code> en la llamada <code>Restar(10, 3)</code> si la función es <code>Funcion r &lt;- Restar(a, b)</code>?", opts: ["3", "10", "7", "Nada"], a: 1, why: "Los parámetros se asignan en orden: a=10, b=3." },
    { q: "¿Cuál es un buen motivo para crear una función?", opts: ["El mismo cálculo se repite en varias partes", "Para que el programa tenga más líneas", "Para usar menos variables", "Nunca conviene"], a: 0, why: "Evita repetir código y facilita los cambios." },
    { q: "¿Qué hace <code>Retornar</code>?", opts: ["Repite la función", "Devuelve un valor y termina la función", "Vuelve al inicio del programa", "Muestra un valor"], a: 1, why: "Sale de la función entregando ese valor a quien la llamó." },
  ],
  exercises: [
    { id: "ex12a", title: "Función Potencia", lang: "pseudo",
      text: "Escribe una función <code>Potencia(base, exponente)</code> que calcule base elevado a exponente <b>usando un bucle</b> (sin usar ^). El programa lee base y exponente y muestra el resultado en la última línea.",
      starter: "Funcion r <- Potencia(base, exponente)\n\t\nFinFuncion\n\nAlgoritmo Pot\n\tLeer b, e\n\tEscribir Potencia(b, e)\nFinAlgoritmo",
      tests: [{ in: ["2", "10"], out: "1024" }, { in: ["5", "0"], out: "1" }, { in: ["3", "4"], out: "81" }],
      hint: "r empieza en 1 y se multiplica por base, exponente veces.",
      solution: "Funcion r <- Potencia(base, exponente)\n\tr <- 1\n\tPara i <- 1 Hasta exponente Hacer\n\t\tr <- r * base\n\tFinPara\nFinFuncion\n\nAlgoritmo Pot\n\tLeer b, e\n\tEscribir Potencia(b, e)\nFinAlgoritmo" },
    { id: "ex12b", title: "Función Factorial", lang: "pseudo",
      text: "Escribe una función <code>Factorial(n)</code>. El programa lee N y muestra los factoriales de 0 a N con el formato <code>i! = valor</code>. Recuerda que 0! = 1.",
      starter: "Funcion r <- Factorial(n)\n\t\nFinFuncion\n\nAlgoritmo Factoriales\n\tLeer n\n\t\nFinAlgoritmo",
      tests: [{ in: ["4"], out: "0! = 1\n1! = 1\n2! = 2\n3! = 6\n4! = 24" }, { in: ["0"], out: "0! = 1" }],
      hint: "Dentro de la función: r <- 1 y un Para de 1 a n multiplicando. En el algoritmo, un Para de 0 a n.",
      solution: 'Funcion r <- Factorial(n)\n\tr <- 1\n\tPara i <- 1 Hasta n Hacer\n\t\tr <- r * i\n\tFinPara\nFinFuncion\n\nAlgoritmo Factoriales\n\tLeer n\n\tPara i <- 0 Hasta n Hacer\n\t\tEscribir i, "! = ", Factorial(i)\n\tFinPara\nFinAlgoritmo' },
    { id: "ex12c", title: "Validar contraseña", lang: "pseudo",
      text: "Escribe una función <code>EsSegura(clave)</code> que devuelva Verdadero si la clave tiene <b>al menos 8 caracteres</b> y <b>contiene al menos un dígito</b> (0-9). El programa lee una clave y muestra <code>Segura</code> o <code>Insegura</code>.",
      starter: "Funcion r <- EsSegura(clave)\n\t\nFinFuncion\n\nAlgoritmo Claves\n\tDefinir c Como Cadena\n\tLeer c\n\t\nFinAlgoritmo",
      tests: [{ in: ["password1"], out: "Segura" }, { in: ["corta1"], out: "Insegura" }, { in: ["sindigitos"], out: "Insegura" }, { in: ["12345678"], out: "Segura" }],
      hint: "Recorre la clave con una bandera tieneDigito. Un carácter es dígito si está entre \"0\" y \"9\": letra >= \"0\" Y letra <= \"9\".",
      solution: 'Funcion r <- EsSegura(clave)\n\ttieneDigito <- Falso\n\tPara i <- 0 Hasta Longitud(clave) - 1 Hacer\n\t\tletra <- Subcadena(clave, i, i)\n\t\tSi letra >= "0" Y letra <= "9" Entonces\n\t\t\ttieneDigito <- Verdadero\n\t\tFinSi\n\tFinPara\n\tr <- Longitud(clave) >= 8 Y tieneDigito\nFinFuncion\n\nAlgoritmo Claves\n\tDefinir c Como Cadena\n\tLeer c\n\tSi EsSegura(c) Entonces\n\t\tEscribir "Segura"\n\tSiNo\n\t\tEscribir "Insegura"\n\tFinSi\nFinAlgoritmo' },
  ]
});

L({
  id: "l13", module: "m3", title: "Algoritmos clásicos: buscar y ordenar", minutes: 45,
  summary: "Búsqueda lineal y binaria, ordenamiento burbuja y una primera idea de eficiencia.",
  sections: [
    { h: "Por qué estudiar algoritmos clásicos", body: `
<p>Buscar y ordenar son de las tareas más comunes en la informática: buscar un contacto, ordenar productos por precio, mostrar el ranking de un juego. Estudiar cómo se hacen te entrena en pensamiento lógico y es un tema habitual en <b>entrevistas técnicas</b>.</p>` },
    { h: "Búsqueda lineal", body: `
<p>La más simple: revisar los elementos uno por uno hasta encontrarlo. Funciona siempre, esté o no ordenada la lista.</p>
${C(`Funcion pos <- BuscarLineal(v, n, x)
	pos <- -1
	i <- 0
	Mientras i < n Y pos = -1 Hacer
		Si v[i] = x Entonces
			pos <- i
		FinSi
		i <- i + 1
	FinMientras
FinFuncion

Algoritmo Lineal
	Dimension v[6]
	v[0] <- 15
	v[1] <- 3
	v[2] <- 42
	v[3] <- 8
	v[4] <- 23
	v[5] <- 4
	Escribir "El 23 está en la posición ", BuscarLineal(v, 6, 23)
	Escribir "El 99 está en la posición ", BuscarLineal(v, 6, 99)
FinAlgoritmo`)}
<p>Fíjate en la condición <code>pos = -1</code>: en cuanto lo encuentra, deja de buscar. Si la lista tiene un millón de elementos, en el peor caso revisa el millón.</p>` },
    { h: "Búsqueda binaria", body: `
<p>Si la lista está <b>ordenada</b>, hay algo mucho mejor. Piensa en buscar una palabra en un diccionario de papel: abres por la mitad y, según la letra, descartas la mitad izquierda o la derecha. Repites con la mitad que queda.</p>
${C(`Funcion pos <- BuscarBinaria(v, n, x)
	pos <- -1
	izq <- 0
	der <- n - 1
	Mientras izq <= der Y pos = -1 Hacer
		medio <- trunc((izq + der) / 2)
		Si v[medio] = x Entonces
			pos <- medio
		SiNo
			Si v[medio] < x Entonces
				izq <- medio + 1
			SiNo
				der <- medio - 1
			FinSi
		FinSi
	FinMientras
FinFuncion

Algoritmo Binaria
	Dimension v[8]
	Para i <- 0 Hasta 7 Hacer
		v[i] <- (i + 1) * 5
	FinPara
	Escribir v
	Escribir "El 35 está en la posición ", BuscarBinaria(v, 8, 35)
FinAlgoritmo`)}
${TABLE(["Elementos", "Lineal (peor caso)", "Binaria (peor caso)"], [["10", "10 pasos", "4 pasos"], ["1.000", "1.000 pasos", "10 pasos"], ["1.000.000", "1.000.000 pasos", "20 pasos"]])}
<p>¡La diferencia es enorme! Cada paso de la binaria descarta la mitad.</p>` },
    { h: "Ordenamiento burbuja", body: `
<p>Para ordenar de menor a mayor, la idea más simple: recorre la lista comparando cada par de vecinos; si están al revés, <b>intercámbialos</b>. Después de una pasada completa, el mayor «burbujea» hasta el final. Repite hasta que todo esté ordenado.</p>
${C(`Algoritmo Burbuja
	Dimension v[6]
	v[0] <- 29
	v[1] <- 10
	v[2] <- 14
	v[3] <- 37
	v[4] <- 13
	v[5] <- 5
	n <- 6
	Escribir "Antes:   ", v
	Para pasada <- 1 Hasta n - 1 Hacer
		Para i <- 0 Hasta n - 1 - pasada Hacer
			Si v[i] > v[i + 1] Entonces
				aux <- v[i]
				v[i] <- v[i + 1]
				v[i + 1] <- aux
			FinSi
		FinPara
		Escribir "Pasada ", pasada, ": ", v
	FinPara
FinAlgoritmo`)}
<p>¿Recuerdas el ejercicio de intercambiar dos variables con una auxiliar? Aquí lo usas para intercambiar dos posiciones del arreglo.</p>
${TIP("Ejecuta este programa <b>Paso a paso</b> y mira cómo se mueven los números. Entender visualmente un algoritmo de ordenamiento es muy satisfactorio.")}` },
    { h: "Una primera idea de eficiencia", body: `
<p>No todos los algoritmos que resuelven un problema son igual de buenos. Los programadores miden <b>cómo crece el trabajo</b> cuando crecen los datos. Esto se escribe con la notación <b>O grande</b> (Big O):</p>
${TABLE(["Notación", "Nombre", "Ejemplo", "Con 1.000 datos"], [["O(1)", "Constante", "Leer v[5]", "1 paso"], ["O(log n)", "Logarítmica", "Búsqueda binaria", "~10 pasos"], ["O(n)", "Lineal", "Búsqueda lineal, sumar todo", "~1.000 pasos"], ["O(n²)", "Cuadrática", "Burbuja (dos bucles anidados)", "~1.000.000 pasos"]])}
<p>Regla práctica: <b>un bucle que recorre todo es O(n); dos bucles anidados que recorren todo son O(n²)</b>.</p>
${PRO("En la práctica casi nunca programas tu propio ordenamiento: los lenguajes traen uno muy eficiente (en JavaScript, <code>array.sort()</code>). Pero entender estas ideas te permite elegir bien, detectar código lento y responder preguntas de entrevistas técnicas.")}` },
  ],
  cheat: [
    { h: "Intercambio", body: CN(`aux <- v[i]
v[i] <- v[j]
v[j] <- aux`) },
    { h: "Búsqueda binaria (lista ordenada)", body: CN(`izq <- 0
der <- n - 1
Mientras izq <= der Hacer
	medio <- trunc((izq + der) / 2)
	// igual → encontrado
	// menor → izq <- medio + 1
	// mayor → der <- medio - 1
FinMientras`) },
    { h: "Burbuja", body: CN(`Para pasada <- 1 Hasta n - 1 Hacer
	Para i <- 0 Hasta n - 1 - pasada Hacer
		Si v[i] > v[i + 1] Entonces
			// intercambiar
		FinSi
	FinPara
FinPara`) },
    { h: "Eficiencia", body: `O(1) &lt; O(log n) &lt; O(n) &lt; O(n²)<br>Un bucle completo ≈ O(n). Dos anidados ≈ O(n²).` },
  ],
  quiz: [
    { q: "¿Qué búsqueda funciona en una lista desordenada?", opts: ["Binaria", "Lineal", "Ninguna", "Las dos"], a: 1, why: "La binaria necesita orden para descartar mitades." },
    { q: "En una lista ordenada de 1.000.000 elementos, ¿cuántos pasos necesita como máximo la búsqueda binaria?", opts: ["1.000.000", "500.000", "Unos 20", "1"], a: 2, why: "Cada paso divide a la mitad: 2^20 ≈ 1.000.000." },
    { q: "Después de la primera pasada de burbuja (orden ascendente), ¿qué se sabe con seguridad?", opts: ["El menor está al principio", "El mayor está al final", "Todo está ordenado", "Nada"], a: 1, why: "El mayor va «burbujeando» hasta la última posición." },
    { q: "Un algoritmo con dos bucles anidados que recorren toda la lista es aproximadamente...", opts: ["O(1)", "O(log n)", "O(n)", "O(n²)"], a: 3, why: "n vueltas por cada una de n vueltas: n × n." },
    { q: "En la búsqueda binaria, si <code>v[medio] &lt; x</code>, ¿qué haces?", opts: ["der <- medio - 1", "izq <- medio + 1", "Terminar", "medio <- medio + 1"], a: 1, why: "El buscado es mayor que el medio: está a la derecha, se descarta la izquierda." },
  ],
  exercises: [
    { id: "ex13a", title: "Ordenar de mayor a menor", lang: "pseudo",
      text: "Lee 5 números en un arreglo, ordénalos de <b>mayor a menor</b> con burbuja y muéstralos uno por línea.",
      starter: "Algoritmo OrdenDesc\n\tDimension v[5]\n\tPara i <- 0 Hasta 4 Hacer\n\t\tLeer v[i]\n\tFinPara\n\t\nFinAlgoritmo",
      tests: [{ in: ["3", "9", "1", "7", "5"], out: "9\n7\n5\n3\n1" }, { in: ["10", "20", "30", "40", "50"], out: "50\n40\n30\n20\n10" }],
      hint: "Es el mismo burbuja, pero intercambia cuando v[i] < v[i + 1].",
      solution: 'Algoritmo OrdenDesc\n\tDimension v[5]\n\tPara i <- 0 Hasta 4 Hacer\n\t\tLeer v[i]\n\tFinPara\n\tPara p <- 1 Hasta 4 Hacer\n\t\tPara i <- 0 Hasta 4 - p Hacer\n\t\t\tSi v[i] < v[i + 1] Entonces\n\t\t\t\taux <- v[i]\n\t\t\t\tv[i] <- v[i + 1]\n\t\t\t\tv[i + 1] <- aux\n\t\t\tFinSi\n\t\tFinPara\n\tFinPara\n\tPara i <- 0 Hasta 4 Hacer\n\t\tEscribir v[i]\n\tFinPara\nFinAlgoritmo' },
    { id: "ex13b", title: "Pasos de la búsqueda binaria", lang: "pseudo",
      text: "El arreglo tiene los múltiplos de 3 del 3 al 30 (10 elementos, ya ordenados). Lee un número X, búscalo con búsqueda binaria y muestra en la última línea <code>Encontrado en P tras K comparaciones</code> o <code>No está tras K comparaciones</code>. Cuenta una comparación cada vez que miras <code>v[medio]</code>.",
      starter: "Algoritmo PasosBinaria\n\tDimension v[10]\n\tPara i <- 0 Hasta 9 Hacer\n\t\tv[i] <- (i + 1) * 3\n\tFinPara\n\tLeer x\n\t\nFinAlgoritmo",
      tests: [{ in: ["15"], out: "Encontrado en 4 tras 1 comparaciones" }, { in: ["30"], out: "Encontrado en 9 tras 4 comparaciones" }, { in: ["7"], out: "No está tras 3 comparaciones" }],
      hint: "Usa izq, der, medio <- trunc((izq + der) / 2) y un contador que aumenta en cada vuelta del Mientras.",
      solution: 'Algoritmo PasosBinaria\n\tDimension v[10]\n\tPara i <- 0 Hasta 9 Hacer\n\t\tv[i] <- (i + 1) * 3\n\tFinPara\n\tLeer x\n\tizq <- 0\n\tder <- 9\n\tpos <- -1\n\tk <- 0\n\tMientras izq <= der Y pos = -1 Hacer\n\t\tmedio <- trunc((izq + der) / 2)\n\t\tk <- k + 1\n\t\tSi v[medio] = x Entonces\n\t\t\tpos <- medio\n\t\tSiNo\n\t\t\tSi v[medio] < x Entonces\n\t\t\t\tizq <- medio + 1\n\t\t\tSiNo\n\t\t\t\tder <- medio - 1\n\t\t\tFinSi\n\t\tFinSi\n\tFinMientras\n\tSi pos = -1 Entonces\n\t\tEscribir "No está tras ", k, " comparaciones"\n\tSiNo\n\t\tEscribir "Encontrado en ", pos, " tras ", k, " comparaciones"\n\tFinSi\nFinAlgoritmo' },
  ]
});

</script>
<script>
/* content/m4.js */
/* MÓDULO 4 · Del pseudocódigo a JavaScript */
MOD({
  id: "m4", n: 4, title: "Del pseudocódigo a JavaScript", lang: "js",
  desc: "Traducir todo lo aprendido a un lenguaje real, usado en millones de sitios y apps.",
  lessons: ["l14", "l15", "l16", "l17"],
  exam: {
    extra: [
      { q: "¿Cuál es la traducción de <code>Escribir \"Hola\"</code> a JavaScript?", opts: ["print(\"Hola\")", "console.log(\"Hola\")", "echo \"Hola\"", "Escribir(\"Hola\")"], a: 1, why: "console.log muestra un valor en la consola." },
      { q: "¿Qué muestra <code>console.log(\"5\" + 3)</code>?", opts: ["8", "53", "Error", "\"8\""], a: 1, why: "Si uno es texto, + concatena: \"53\"." },
      { q: "¿Qué palabra usas para una variable que NO va a cambiar?", opts: ["let", "var", "const", "fixed"], a: 2, why: "const declara una constante; intentar reasignarla da error." },
      { q: "¿Cuál compara valor y tipo a la vez?", opts: ["=", "==", "===", "=>"], a: 2, why: "=== es la comparación estricta, la recomendada." },
      { q: "¿Qué devuelve <code>[10, 20, 30].length</code>?", opts: ["2", "3", "30", "60"], a: 1, why: "length es la cantidad de elementos." },
      { q: "¿Qué hace <code>return</code> dentro de una función?", opts: ["Muestra el valor", "Devuelve el valor y termina la función", "Repite la función", "Nada"], a: 1, why: "Igual que Retornar en pseudocódigo." },
      { q: "¿Qué muestra?", code: "let total = 0;\nfor (let i = 1; i <= 4; i++) {\n  total += i;\n}\nconsole.log(total);", lang: "js", opts: ["4", "10", "5", "0"], a: 1, why: "1+2+3+4 = 10." },
      { q: "¿Qué devuelve <code>[1, 2, 3].map(x => x * 10)</code>?", opts: ["[10, 20, 30]", "60", "[1, 2, 3, 10]", "30"], a: 0, why: "map crea un arreglo nuevo aplicando la función a cada elemento." },
      { q: "¿Cómo accedes a la propiedad <code>nombre</code> del objeto <code>persona</code>?", opts: ["persona[nombre]", "persona.nombre", "persona->nombre", "nombre.persona"], a: 1, why: "Con punto: persona.nombre (o persona[\"nombre\"] con comillas)." },
      { fill: true, q: "Completa para que el bucle se repita mientras <code>n</code> sea mayor que 0: <code>___ (n > 0) { n--; }</code>", a: ["while"], why: "while es el Mientras de JavaScript." },
    ],
    challenge: {
      id: "ex_m4", title: "Resumen de ventas", lang: "js",
      text: "Escribe una función <code>resumen(ventas)</code> que reciba un arreglo de números y devuelva un <b>objeto</b> con <code>total</code> (suma), <code>maximo</code> (el mayor) y <code>cantidad</code> (cuántos hay). Ejemplo: <code>resumen([10, 40, 25])</code> → <code>{ total: 75, maximo: 40, cantidad: 3 }</code>.",
      starter: "function resumen(ventas) {\n  // completa\n}\n\nconsole.log(resumen([10, 40, 25]));",
      tests: [{ expr: "resumen([10, 40, 25])", expect: { total: 75, maximo: 40, cantidad: 3 } }, { expr: "resumen([5])", expect: { total: 5, maximo: 5, cantidad: 1 } }, { expr: "resumen([-3, -1, -7])", expect: { total: -11, maximo: -1, cantidad: 3 } }],
      hint: "Recorre con for...of acumulando total y actualizando maximo (empieza con ventas[0]). cantidad es ventas.length. Devuelve { total, maximo, cantidad }.",
      solution: "function resumen(ventas) {\n  let total = 0;\n  let maximo = ventas[0];\n  for (const v of ventas) {\n    total += v;\n    if (v > maximo) maximo = v;\n  }\n  return { total: total, maximo: maximo, cantidad: ventas.length };\n}\n\nconsole.log(resumen([10, 40, 25]));"
    }
  }
});

L({
  id: "l14", module: "m4", title: "Tu primer JavaScript", minutes: 35, lang: "js",
  summary: "Mostrar datos, variables con let y const, tipos y operadores en un lenguaje real.",
  sections: [
    { h: "¿Por qué JavaScript?", body: `
<p>Ya sabes programar: variables, decisiones, bucles, arreglos y funciones son ideas que dominas. Ahora vamos a escribirlas en un <b>lenguaje real</b>. Elegimos <b>JavaScript</b> porque:</p>
<ul><li>Es el lenguaje de la web: funciona en cualquier navegador, incluido el de tu móvil, sin instalar nada.</li><li>Sirve para páginas web (frontend), servidores (backend con Node.js), apps móviles (React Native) y más.</li><li>Es uno de los lenguajes con más ofertas de trabajo en el mundo.</li></ul>
${PRO("Muchas personas que se dedican a programar empezaron justamente por JavaScript. Una vez que lo manejas, aprender Python, Java o C# es mucho más fácil: los conceptos son los mismos.")}` },
    { h: "Mostrar datos: console.log", body: `
<p><code>console.log()</code> es el <code>Escribir</code> de JavaScript. Muestra valores en la consola:</p>
${CJ(`console.log("Hola, mundo");
console.log(2 + 3);
console.log("El total es", 150);`)}
<p>Reglas de escritura nuevas:</p>
<ul><li>Los textos van entre comillas <code>"..."</code> o <code>'...'</code>.</li><li>Cada instrucción termina con punto y coma <code>;</code> (en realidad es opcional, pero se recomienda).</li><li>Los comentarios también son <code>//</code>.</li><li><b>Mayúsculas y minúsculas importan</b>: <code>console.log</code> funciona, <code>Console.Log</code> no.</li></ul>` },
    { h: "Variables: let y const", body: `
<p>En JavaScript declaras variables con <code>let</code> (si va a cambiar) o <code>const</code> (si no va a cambiar). La asignación se hace con <code>=</code> (lo que en pseudocódigo era <code>&lt;-</code>):</p>
${TABLE(["Pseudocódigo", "JavaScript"], [["<code>Definir edad Como Entero</code><br><code>edad &lt;- 25</code>", "<code>let edad = 25;</code>"], ["<code>edad &lt;- edad + 1</code>", "<code>edad = edad + 1;</code> o <code>edad++;</code>"], ["(un valor fijo)", "<code>const PI = 3.1416;</code>"]])}
${CJ(`let puntos = 10;
puntos = puntos + 5;
puntos += 5;       // atajo de puntos = puntos + 5
puntos++;          // atajo de puntos = puntos + 1
console.log(puntos);

const nombre = "Ada";
console.log("Hola", nombre);
// nombre = "Grace";  // esto daría error: es const`)}
${TIP("Regla práctica: usa <code>const</code> por defecto y cambia a <code>let</code> solo si necesitas reasignar. Verás también <code>var</code> en código viejo: evítalo.")}` },
    { h: "Tipos de datos en JavaScript", body: `
${TABLE(["Pseudocódigo", "JavaScript", "Ejemplo"], [["Entero / Real", "<code>number</code> (un solo tipo para ambos)", "<code>42</code>, <code>3.14</code>"], ["Cadena", "<code>string</code>", "<code>\"Hola\"</code>"], ["Logico", "<code>boolean</code>", "<code>true</code>, <code>false</code>"], ["(sin valor)", "<code>undefined</code> / <code>null</code>", ""]])}
${CJ(`console.log(typeof 42);
console.log(typeof "hola");
console.log(typeof true);
let algo;
console.log(algo);   // undefined: declarada sin valor`)}
<p>JavaScript no te obliga a definir el tipo, y una variable puede cambiar de tipo. Eso da libertad, pero también errores sorprendentes:</p>
${CJ(`console.log("5" + 3);    // "53": concatena
console.log("5" - 3);    // 2: convierte a número
console.log(Number("5") + 3);  // 8: conversión explícita`)}
${WARN("Cuando un dato viene del usuario (un formulario, <code>prompt</code>) llega como <b>texto</b>. Conviértelo con <code>Number()</code> antes de hacer cuentas.")}` },
    { h: "Operadores", body: `
${TABLE(["Pseudocódigo", "JavaScript"], [["<code>+ - * /</code>", "<code>+ - * /</code>"], ["<code>MOD</code>", "<code>%</code>"], ["<code>^</code>", "<code>**</code>"], ["<code>trunc(x)</code>", "<code>Math.trunc(x)</code>"], ["<code>=</code> (comparar)", "<code>===</code>"], ["<code>&lt;&gt;</code>", "<code>!==</code>"], ["<code>Y</code> / <code>O</code> / <code>NO</code>", "<code>&amp;&amp;</code> / <code>||</code> / <code>!</code>"], ["<code>raiz(x)</code>", "<code>Math.sqrt(x)</code>"], ["<code>aleatorio(1,6)</code>", "<code>Math.floor(Math.random() * 6) + 1</code>"]])}
${CJ(`const edad = 20;
console.log(17 % 5);
console.log(2 ** 10);
console.log(edad >= 18 && edad < 65);
console.log(edad === 20);
console.log(!(edad > 30));`)}
${WARN("En JavaScript <code>=</code> asigna y <code>===</code> compara. También existe <code>==</code>, pero convierte tipos de forma confusa (<code>\"5\" == 5</code> es true). Usa siempre <code>===</code> y <code>!==</code>.")}` },
    { h: "Plantillas de texto", body: `
<p>Para armar textos con variables, JavaScript tiene las <b>plantillas</b> (template strings): se escriben entre acentos graves <code>\`</code> y las variables van dentro de <code>\${ }</code>:</p>
${CJ(`const producto = "Café";
const precio = 3.5;
const cantidad = 4;
console.log(\`\${cantidad} x \${producto} = $\${precio * cantidad}\`);`)}
<p>Es mucho más cómodo que concatenar con <code>+</code>. En el teclado del móvil, el acento grave suele estar manteniendo pulsada la tecla del apóstrofo, o en el panel de símbolos. También tienes un botón en el editor.</p>` },
  ],
  cheat: [
    { h: "Mostrar", body: CN(`console.log("texto", variable);`, "js") },
    { h: "Variables", body: CN(`let x = 5;        // puede cambiar
const PI = 3.14;  // no cambia
x += 2;  x++;`, "js") },
    { h: "Tipos", body: `<code>number</code> · <code>string</code> · <code>boolean</code> · <code>undefined</code> · <code>null</code><br><code>typeof x</code> dice el tipo. <code>Number(\"5\")</code> convierte.` },
    { h: "Traducción rápida", body: TABLE(["Pseudo", "JS"], [["&lt;-", "="], ["=", "==="], ["&lt;&gt;", "!=="], ["MOD", "%"], ["Y O NO", "&amp;&amp; || !"], ["^", "**"]]) },
    { h: "Plantilla", body: CN("`Hola ${nombre}, tienes ${edad} años`", "js") },
  ],
  quiz: [
    { q: "¿Cómo se declara una variable que cambiará de valor?", opts: ["const x = 1;", "let x = 1;", "Definir x;", "x <- 1;"], a: 1, why: "let para variables que se reasignan." },
    { q: "¿Qué muestra <code>console.log(10 % 4)</code>?", opts: ["2.5", "2", "6", "40"], a: 1, why: "% es MOD: 10 entre 4 sobra 2." },
    { q: "¿Qué da <code>\"7\" === 7</code>?", opts: ["true", "false", "Error", "\"77\""], a: 1, why: "=== compara también el tipo: string no es igual a number." },
    { q: "¿Cuál es el equivalente de <code>edad >= 18 Y tieneDni</code>?", opts: ["edad >= 18 and tieneDni", "edad >= 18 && tieneDni", "edad >= 18 || tieneDni", "edad >= 18 & tieneDni"], a: 1, why: "&& es el Y lógico." },
    { q: "¿Qué muestra?", code: "const a = 3;\nconst b = 4;\nconsole.log(`${a} + ${b} = ${a + b}`);", lang: "js", opts: ["${a} + ${b} = ${a + b}", "3 + 4 = 7", "3 + 4 = 34", "Error"], a: 1, why: "Las plantillas reemplazan cada ${...} por su valor." },
    { q: "¿Qué pasa al ejecutar <code>const x = 1; x = 2;</code>?", opts: ["x vale 2", "Error: no se puede reasignar una constante", "x vale 1 y 2", "Nada"], a: 1, why: "const no permite reasignar." },
    { fill: true, q: "¿Qué muestra <code>console.log(typeof \"hola\")</code>?", a: ["string"], why: "Los textos son de tipo string." },
  ],
  exercises: [
    { id: "ex14a", title: "Calcular el IVA", lang: "js",
      text: "Crea una constante <code>precio</code> con valor 200 y otra <code>iva</code> con 0.21. Muestra con <code>console.log</code> exactamente: <code>Precio final: 242</code>",
      starter: "const precio = 200;\n\n",
      tests: [{ out: "Precio final: 242" }],
      hint: "console.log(`Precio final: ${precio * (1 + iva)}`) o console.log(\"Precio final:\", precio + precio * iva)",
      solution: "const precio = 200;\nconst iva = 0.21;\nconsole.log(\"Precio final:\", precio + precio * iva);" },
    { id: "ex14b", title: "De texto a número", lang: "js",
      text: "Tienes <code>const a = \"12\";</code> y <code>const b = \"30\";</code> (textos, como si vinieran de un formulario). Muestra su <b>suma numérica</b>: la salida debe ser <code>42</code>.",
      starter: "const a = \"12\";\nconst b = \"30\";\n",
      tests: [{ out: "42" }],
      hint: "Number(a) + Number(b)",
      solution: "const a = \"12\";\nconst b = \"30\";\nconsole.log(Number(a) + Number(b));" },
    { id: "ex14c", title: "Leer datos con leer()", lang: "js",
      text: "En este Laboratorio, <code>leer()</code> devuelve (como texto) la siguiente línea del cuadro <b>Entradas</b>. Lee dos números, y muestra como última línea su promedio. Ejemplo: entradas 4 y 7 → <code>5.5</code>",
      starter: "const x = Number(leer());\n",
      tests: [{ in: ["4", "7"], out: "5.5" }, { in: ["10", "20"], out: "15" }],
      hint: "const y = Number(leer()); console.log((x + y) / 2);",
      solution: "const x = Number(leer());\nconst y = Number(leer());\nconsole.log((x + y) / 2);" },
  ]
});

L({
  id: "l15", module: "m4", title: "Decisiones y bucles en JavaScript", minutes: 35, lang: "js",
  summary: "if / else, switch, while y for: las estructuras de control con sintaxis real.",
  sections: [
    { h: "Llaves y paréntesis", body: `
<p>En JavaScript los bloques no terminan con <code>FinSi</code> o <code>FinPara</code>: se encierran entre <b>llaves</b> <code>{ }</code>. Y las condiciones van entre <b>paréntesis</b> <code>( )</code>.</p>
${TABLE(["Pseudocódigo", "JavaScript"], [["<code>Si cond Entonces</code><br>&nbsp;&nbsp;...<br><code>SiNo</code><br>&nbsp;&nbsp;...<br><code>FinSi</code>", "<code>if (cond) {</code><br>&nbsp;&nbsp;...<br><code>} else {</code><br>&nbsp;&nbsp;...<br><code>}</code>"], ["<code>Mientras cond Hacer ... FinMientras</code>", "<code>while (cond) { ... }</code>"], ["<code>Repetir ... Hasta Que cond</code>", "<code>do { ... } while (!cond);</code>"], ["<code>Para i &lt;- 1 Hasta 10 Hacer</code>", "<code>for (let i = 1; i &lt;= 10; i++) {</code>"], ["<code>Segun x Hacer</code>", "<code>switch (x) {</code>"]])}` },
    { h: "if, else if, else", body: `
${CJ(`const nota = 8;
if (nota >= 9) {
  console.log("Excelente");
} else if (nota >= 7) {
  console.log("Muy bien");
} else if (nota >= 4) {
  console.log("Aprobado");
} else {
  console.log("Desaprobado");
}`)}
<p>¡Mira qué limpio queda! <code>else if</code> evita tener que anidar como hacíamos en pseudocódigo. Es lo mismo, solo que más cómodo de escribir.</p>
${TIP("Cuando un if tiene una sola instrucción las llaves son técnicamente opcionales, pero ponlas siempre. Evitan errores muy difíciles de ver.")}` },
    { h: "switch", body: `
${CJ(`const dia = 6;
switch (dia) {
  case 1:
    console.log("Lunes");
    break;
  case 6:
  case 7:
    console.log("Fin de semana");
    break;
  default:
    console.log("Otro día");
}`)}
${WARN("Cada <code>case</code> necesita <code>break;</code> al final. Si lo olvidas, se siguen ejecutando los casos de abajo. Es un error muy común.")}` },
    { h: "while y do...while", body: `
${CJ(`let n = 1;
while (n <= 100) {
  n = n * 2;
}
console.log("Primera potencia de 2 mayor que 100:", n);

let intentos = 0;
do {
  intentos++;
} while (intentos < 3);
console.log("Intentos:", intentos);`)}` },
    { h: "for", body: `
<p>El <code>for</code> tiene tres partes separadas por <code>;</code>: <b>inicio</b>, <b>condición</b> y <b>actualización</b>. ¡Son las tres partes de un bucle que ya conoces!</p>
${CJ(`for (let i = 1; i <= 5; i++) {
  console.log(\`7 x \${i} = \${7 * i}\`);
}

// Contar hacia atrás de 2 en 2
for (let i = 10; i >= 0; i -= 2) {
  console.log(i);
}`)}
<p>Además existen <code>break</code> (salir del bucle ya) y <code>continue</code> (saltar a la siguiente vuelta):</p>
${CJ(`for (let i = 1; i <= 10; i++) {
  if (i % 2 === 0) continue;   // salta los pares
  if (i > 7) break;            // corta al pasar 7
  console.log(i);
}`)}
${PRO("El 80% de los bucles en código profesional moderno de JavaScript recorren arreglos, y para eso se usan formas aún más cortas (<code>for...of</code>, <code>.map</code>, <code>.filter</code>) que verás en la lección siguiente.")}` },
  ],
  cheat: [
    { h: "if / else if / else", body: CN(`if (x > 0) {
  ...
} else if (x === 0) {
  ...
} else {
  ...
}`, "js") },
    { h: "Bucles", body: CN(`while (cond) { ... }

do { ... } while (cond);

for (let i = 0; i < n; i++) { ... }`, "js") },
    { h: "switch", body: CN(`switch (op) {
  case 1: ...; break;
  default: ...
}`, "js") },
    { h: "Control", body: `<code>break</code> sale del bucle · <code>continue</code> pasa a la siguiente vuelta` },
  ],
  quiz: [
    { q: "¿Qué muestra?", code: "const x = 5;\nif (x > 10) {\n  console.log(\"A\");\n} else if (x > 3) {\n  console.log(\"B\");\n} else {\n  console.log(\"C\");\n}", lang: "js", opts: ["A", "B", "C", "B y C"], a: 1, why: "5 > 10 no; 5 > 3 sí: muestra B y no revisa el resto." },
    { q: "¿Cuántas veces se repite? <code>for (let i = 0; i &lt; 5; i++)</code>", opts: ["4", "5", "6", "Infinitas"], a: 1, why: "i toma 0, 1, 2, 3, 4." },
    { q: "¿Qué pasa si olvidas <code>break</code> en un case de switch?", opts: ["Error de sintaxis", "Se ejecutan también los casos siguientes", "No pasa nada", "Se repite el switch"], a: 1, why: "La ejecución «cae» a los casos de abajo hasta encontrar un break." },
    { q: "¿Qué hace <code>continue</code>?", opts: ["Termina el bucle", "Salta a la siguiente vuelta del bucle", "Repite la vuelta actual", "Termina el programa"], a: 1, why: "Ignora el resto del bloque en esa vuelta y sigue con la próxima." },
    { q: "¿Qué muestra?", code: "let s = 0;\nfor (let i = 2; i <= 6; i += 2) {\n  s += i;\n}\nconsole.log(s);", lang: "js", opts: ["12", "20", "6", "8"], a: 0, why: "2 + 4 + 6 = 12." },
  ],
  exercises: [
    { id: "ex15a", title: "FizzBuzz", lang: "js",
      text: "El clásico de las entrevistas: muestra los números del 1 al 15, uno por línea, pero si es múltiplo de 3 muestra <code>Fizz</code>, si es múltiplo de 5 muestra <code>Buzz</code> y si es múltiplo de ambos <code>FizzBuzz</code>.",
      starter: "for (let i = 1; i <= 15; i++) {\n  \n}",
      tests: [{ out: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz" }],
      hint: "Pregunta primero por múltiplo de 15 (o de 3 y 5 a la vez), después por 3, después por 5, y si no, el número.",
      solution: "for (let i = 1; i <= 15; i++) {\n  if (i % 15 === 0) {\n    console.log(\"FizzBuzz\");\n  } else if (i % 3 === 0) {\n    console.log(\"Fizz\");\n  } else if (i % 5 === 0) {\n    console.log(\"Buzz\");\n  } else {\n    console.log(i);\n  }\n}" },
    { id: "ex15b", title: "Clasificar temperatura", lang: "js",
      text: "Lee una temperatura con <code>Number(leer())</code> y muestra: <code>Frío</code> si es menor que 10, <code>Templado</code> si está entre 10 y 24 (incluidos), <code>Calor</code> si es 25 o más.",
      starter: "const t = Number(leer());\n",
      tests: [{ in: ["5"], out: "Frío" }, { in: ["10"], out: "Templado" }, { in: ["24"], out: "Templado" }, { in: ["31"], out: "Calor" }],
      hint: "if (t < 10) ... else if (t < 25) ... else ...",
      solution: "const t = Number(leer());\nif (t < 10) {\n  console.log(\"Frío\");\n} else if (t < 25) {\n  console.log(\"Templado\");\n} else {\n  console.log(\"Calor\");\n}" },
    { id: "ex15c", title: "Dígitos de un número", lang: "js",
      text: "Lee un número entero positivo y muestra cuántos dígitos tiene, <b>usando un while</b> (sin convertirlo a texto). Ejemplo: 4827 → <code>4</code>",
      starter: "let n = Number(leer());\nlet digitos = 0;\n",
      tests: [{ in: ["4827"], out: "4" }, { in: ["7"], out: "1" }, { in: ["100000"], out: "6" }],
      hint: "Mientras n > 0: n = Math.trunc(n / 10) y suma 1 al contador.",
      solution: "let n = Number(leer());\nlet digitos = 0;\nwhile (n > 0) {\n  n = Math.trunc(n / 10);\n  digitos++;\n}\nconsole.log(digitos);" },
  ]
});

L({
  id: "l16", module: "m4", title: "Funciones en JavaScript", minutes: 35, lang: "js",
  summary: "function, return, parámetros por defecto y funciones flecha.",
  sections: [
    { h: "Declarar y llamar funciones", body: `
${TABLE(["Pseudocódigo", "JavaScript"], [["<code>Funcion r &lt;- Doble(n)</code><br>&nbsp;&nbsp;<code>r &lt;- n * 2</code><br><code>FinFuncion</code>", "<code>function doble(n) {</code><br>&nbsp;&nbsp;<code>return n * 2;</code><br><code>}</code>"]])}
${CJ(`function doble(n) {
  return n * 2;
}

function saludar(nombre) {
  console.log("Hola, " + nombre);
}

console.log(doble(21));
saludar("Ada");`)}
<p>En JavaScript no hay diferencia de sintaxis entre «función» y «subproceso»: una función sin <code>return</code> simplemente devuelve <code>undefined</code>.</p>
${TIP("Convención de nombres: las funciones se nombran con un <b>verbo</b> en camelCase que diga qué hacen: <code>calcularTotal</code>, <code>esValido</code>, <code>obtenerUsuario</code>.")}` },
    { h: "Parámetros y valores por defecto", body: `
${CJ(`function precioFinal(precio, descuento = 0) {
  return precio - precio * descuento / 100;
}

console.log(precioFinal(1000));       // sin descuento
console.log(precioFinal(1000, 15));   // con 15%`)}
<p>Si no pasas un argumento, el parámetro vale <code>undefined</code>, salvo que le hayas dado un <b>valor por defecto</b> con <code>=</code>.</p>` },
    { h: "Funciones flecha", body: `
<p>Es una forma más corta de escribir funciones, muy usada en JavaScript moderno:</p>
${CJ(`// Forma clásica
function cuadrado(x) {
  return x * x;
}

// Forma flecha
const cuadrado2 = (x) => x * x;

// Flecha con varias líneas
const describir = (nombre, edad) => {
  const etapa = edad >= 18 ? "adulto" : "menor";
  return \`\${nombre} es \${etapa}\`;
};

console.log(cuadrado(5), cuadrado2(5));
console.log(describir("Luis", 15));`)}
<p>Arriba aparece otra herramienta: el <b>operador ternario</b> <code>condición ? siVerdadero : siFalso</code>, un if/else compacto que devuelve un valor.</p>` },
    { h: "Ámbito y funciones puras", body: `
${CJ(`const IMPUESTO = 0.21;   // variable global (se ve desde todo el archivo)

function conImpuesto(precio) {
  const total = precio * (1 + IMPUESTO);   // local
  return total;
}

console.log(conImpuesto(100));
// console.log(total);  // error: total solo existe dentro de la función`)}
<p>Una <b>función pura</b> es la que solo depende de sus parámetros y no modifica nada de afuera: dados los mismos datos, siempre devuelve lo mismo. Son las más fáciles de probar y reutilizar.</p>
${PRO("En los equipos de desarrollo se escriben <b>tests automáticos</b>: pequeños programas que llaman a tus funciones con datos conocidos y verifican el resultado. ¡Es exactamente lo que hace el botón <b>Comprobar</b> de los retos de esta app!")}` },
  ],
  cheat: [
    { h: "Declarar", body: CN(`function sumar(a, b) {
  return a + b;
}
const sumar2 = (a, b) => a + b;`, "js") },
    { h: "Por defecto y ternario", body: CN(`function saludar(n = "invitado") { ... }
const tipo = edad >= 18 ? "adulto" : "menor";`, "js") },
    { h: "Recuerda", body: `<ul><li><code>return</code> devuelve y termina.</li><li>Sin return → <code>undefined</code>.</li><li>Nombres con verbo: <code>calcularTotal</code>.</li><li>Prefiere funciones puras.</li></ul>` },
  ],
  quiz: [
    { q: "¿Qué muestra?", code: "function f(x) {\n  return x + 1;\n  console.log(\"hola\");\n}\nconsole.log(f(1));", lang: "js", opts: ["hola y 2", "2", "hola", "undefined"], a: 1, why: "return termina la función: el console.log de adentro nunca se ejecuta." },
    { q: "¿Qué devuelve una función sin return?", opts: ["0", "null", "undefined", "Error"], a: 2, why: "Devuelve undefined." },
    { q: "¿Qué valor tiene <code>r</code>?", code: "const area = (b, h = 2) => b * h;\nconst r = area(5);", lang: "js", opts: ["5", "10", "NaN", "undefined"], a: 1, why: "h toma el valor por defecto 2: 5 × 2 = 10." },
    { q: "¿Qué da <code>10 > 5 ? \"sí\" : \"no\"</code>?", opts: ["\"sí\"", "\"no\"", "true", "10"], a: 0, why: "La condición es verdadera, devuelve el primer valor." },
    { q: "¿Cuál es el mejor nombre para una función que verifica si un email es válido?", opts: ["email", "x", "esEmailValido", "Funcion1"], a: 2, why: "Verbo + qué hace, en camelCase. Para funciones que devuelven boolean es común empezar con «es» o «tiene»." },
  ],
  exercises: [
    { id: "ex16a", title: "esPar", lang: "js",
      text: "Escribe una función <code>esPar(n)</code> que devuelva <code>true</code> si n es par y <code>false</code> si no.",
      starter: "function esPar(n) {\n  \n}\n\nconsole.log(esPar(4), esPar(7));",
      tests: [{ expr: "esPar(4)", expect: true }, { expr: "esPar(7)", expect: false }, { expr: "esPar(0)", expect: true }, { expr: "esPar(-2)", expect: true }],
      hint: "return n % 2 === 0;",
      solution: "function esPar(n) {\n  return n % 2 === 0;\n}\n\nconsole.log(esPar(4), esPar(7));" },
    { id: "ex16b", title: "Calcular IMC", lang: "js",
      text: "Escribe <code>imc(peso, altura)</code> que devuelva el índice de masa corporal (peso / altura²) <b>redondeado a 1 decimal</b>. Pista: <code>Math.round(x * 10) / 10</code>.",
      starter: "function imc(peso, altura) {\n  \n}\n\nconsole.log(imc(70, 1.75));",
      tests: [{ expr: "imc(70, 1.75)", expect: 22.9 }, { expr: "imc(50, 1.6)", expect: 19.5 }, { expr: "imc(90, 1.8)", expect: 27.8 }],
      hint: "const valor = peso / (altura ** 2); return Math.round(valor * 10) / 10;",
      solution: "function imc(peso, altura) {\n  const valor = peso / (altura ** 2);\n  return Math.round(valor * 10) / 10;\n}\n\nconsole.log(imc(70, 1.75));" },
    { id: "ex16c", title: "Contar vocales", lang: "js",
      text: "Escribe <code>contarVocales(texto)</code> que devuelva cuántas vocales (a, e, i, o, u, sin importar mayúsculas) tiene el texto. Puedes recorrer un texto con <code>for (const letra of texto)</code> y usar <code>\"aeiou\".includes(letra)</code>.",
      starter: "function contarVocales(texto) {\n  \n}\n\nconsole.log(contarVocales(\"Hola Mundo\"));",
      tests: [{ expr: "contarVocales(\"Hola Mundo\")", expect: 4 }, { expr: "contarVocales(\"AEIOU\")", expect: 5 }, { expr: "contarVocales(\"xyz\")", expect: 0 }],
      hint: "Pasa el texto a minúsculas con texto.toLowerCase() y usa un contador.",
      solution: "function contarVocales(texto) {\n  let c = 0;\n  for (const letra of texto.toLowerCase()) {\n    if (\"aeiou\".includes(letra)) c++;\n  }\n  return c;\n}\n\nconsole.log(contarVocales(\"Hola Mundo\"));" },
  ]
});

L({
  id: "l17", module: "m4", title: "Arreglos y objetos en JavaScript", minutes: 45, lang: "js",
  summary: "Arrays con sus métodos (push, map, filter...) y objetos para modelar datos reales.",
  sections: [
    { h: "Arrays", body: `
<p>En JavaScript los arreglos se escriben entre corchetes y, a diferencia del pseudocódigo, <b>pueden crecer</b>: no necesitas indicar el tamaño.</p>
${CJ(`const frutas = ["manzana", "pera", "uva"];
console.log(frutas[0]);         // primera
console.log(frutas.length);     // cantidad
frutas.push("kiwi");            // agrega al final
console.log(frutas);
const ultima = frutas.pop();    // quita el último y lo devuelve
console.log(ultima, frutas);
console.log(frutas.indexOf("pera"));    // posición, o -1
console.log(frutas.includes("uva"));    // ¿está?`)}` },
    { h: "Recorrer arrays", body: `
${CJ(`const notas = [7, 9, 5, 10];

// for clásico (cuando necesitas el índice)
for (let i = 0; i < notas.length; i++) {
  console.log(\`Nota \${i}: \${notas[i]}\`);
}

// for...of (más simple, cuando solo necesitas el valor)
let suma = 0;
for (const nota of notas) {
  suma += nota;
}
console.log("Promedio:", suma / notas.length);`)}` },
    { h: "Métodos poderosos: map, filter, reduce, sort", body: `
<p>Los arrays traen métodos que reemplazan los patrones de bucles que ya conoces. Reciben una <b>función</b> (normalmente una flecha) que se aplica a cada elemento:</p>
${TABLE(["Método", "Qué hace", "Patrón que reemplaza"], [["<code>map</code>", "Transforma cada elemento → arreglo nuevo", "Recorrer y construir otra lista"], ["<code>filter</code>", "Se queda con los que cumplen la condición", "Recorrer con un Si"], ["<code>reduce</code>", "Combina todos en un solo valor", "Acumulador"], ["<code>find</code>", "Primer elemento que cumple", "Búsqueda lineal"], ["<code>sort</code>", "Ordena", "Burbuja (pero más eficiente)"]])}
${CJ(`const precios = [120, 85, 300, 45, 210];

const conIva = precios.map((p) => p * 1.21);
const baratos = precios.filter((p) => p < 100);
const total = precios.reduce((acum, p) => acum + p, 0);
const primeroCaro = precios.find((p) => p > 200);
const ordenados = [...precios].sort((a, b) => a - b);

console.log(conIva);
console.log(baratos);
console.log(total);
console.log(primeroCaro);
console.log(ordenados);`)}
${WARN("<code>sort()</code> sin función ordena como <b>texto</b>: <code>[10, 9, 100].sort()</code> da <code>[10, 100, 9]</code>. Para números usa siempre <code>sort((a, b) =&gt; a - b)</code>.")}` },
    { h: "Objetos", body: `
<p>Un <b>objeto</b> agrupa datos relacionados con <b>nombre</b>. En lugar de posiciones numéricas, usa <b>propiedades</b>. Es la forma de representar «cosas» del mundo real: un usuario, un producto, un pedido.</p>
${CJ(`const persona = {
  nombre: "Ada",
  edad: 36,
  lenguajes: ["JavaScript", "Python"],
};

console.log(persona.nombre);
console.log(persona["edad"]);
persona.edad = 37;              // modificar
persona.ciudad = "Londres";     // agregar
console.log(persona);
console.log(persona.lenguajes.length);`)}` },
    { h: "Arrays de objetos: datos reales", body: `
<p>Casi todos los datos de una aplicación real tienen esta forma: una lista de objetos. Así llegan los productos de una tienda, los mensajes de un chat o los resultados de una búsqueda.</p>
${CJ(`const productos = [
  { nombre: "Teclado", precio: 45, stock: 10 },
  { nombre: "Monitor", precio: 220, stock: 0 },
  { nombre: "Mouse", precio: 20, stock: 35 },
  { nombre: "Auriculares", precio: 80, stock: 4 },
];

const disponibles = productos.filter((p) => p.stock > 0);
const nombres = disponibles.map((p) => p.nombre);
const valorInventario = productos.reduce((t, p) => t + p.precio * p.stock, 0);
const masBarato = [...productos].sort((a, b) => a.precio - b.precio)[0];

console.log("Disponibles:", nombres);
console.log("Valor del inventario: $" + valorInventario);
console.log("Más barato:", masBarato.nombre);`)}
${PRO("Este formato (objetos y arreglos) es casi idéntico a <b>JSON</b>, el formato con el que se comunican prácticamente todas las aplicaciones y servidores de internet. Cuando consultes una API, recibirás datos así.")}` },
  ],
  cheat: [
    { h: "Arrays", body: CN(`const a = [1, 2, 3];
a.length  a[0]  a.push(4)  a.pop()
a.indexOf(2)  a.includes(2)
for (const x of a) { ... }`, "js") },
    { h: "Métodos", body: CN(`a.map(x => x * 2)
a.filter(x => x > 1)
a.reduce((acc, x) => acc + x, 0)
a.find(x => x > 1)
[...a].sort((x, y) => x - y)`, "js") },
    { h: "Objetos", body: CN(`const p = { nombre: "Ana", edad: 30 };
p.nombre      p["edad"]
p.ciudad = "Lima";`, "js") },
  ],
  quiz: [
    { q: "¿Qué muestra?", code: "const a = [3, 6, 9];\na.push(12);\nconsole.log(a.length);", lang: "js", opts: ["3", "4", "12", "30"], a: 1, why: "push agregó un elemento: ahora hay 4." },
    { q: "¿Qué devuelve <code>[1, 2, 3, 4].filter(x =&gt; x % 2 === 0)</code>?", opts: ["[2, 4]", "[1, 3]", "2", "true"], a: 0, why: "Se queda con los pares." },
    { q: "¿Qué devuelve <code>[1, 2, 3].reduce((acc, x) =&gt; acc + x, 0)</code>?", opts: ["[1, 2, 3]", "6", "0", "3"], a: 1, why: "Acumula: 0+1+2+3 = 6." },
    { q: "¿Qué muestra?", code: "const auto = { marca: \"Fiat\", anio: 2020 };\nconsole.log(auto.anio + 1);", lang: "js", opts: ["2021", "20201", "undefined", "Error"], a: 0, why: "auto.anio es el número 2020." },
    { q: "¿Por qué conviene <code>sort((a, b) =&gt; a - b)</code> para números?", opts: ["Es más rápido", "Sin función, sort ordena como texto", "Para ordenar al revés", "No hace diferencia"], a: 1, why: "Por defecto compara como texto: 100 queda antes que 9." },
    { q: "¿Qué devuelve <code>[\"a\", \"b\"].indexOf(\"z\")</code>?", opts: ["0", "-1", "undefined", "2"], a: 1, why: "-1 indica que no está." },
  ],
  exercises: [
    { id: "ex17a", title: "Aprobados", lang: "js",
      text: "Escribe <code>aprobados(notas)</code> que reciba un arreglo de notas y devuelva un arreglo nuevo solo con las que son 6 o más.",
      starter: "function aprobados(notas) {\n  \n}\n\nconsole.log(aprobados([4, 8, 6, 3, 10]));",
      tests: [{ expr: "aprobados([4, 8, 6, 3, 10])", expect: [8, 6, 10] }, { expr: "aprobados([1, 2])", expect: [] }],
      hint: "return notas.filter((n) => n >= 6);",
      solution: "function aprobados(notas) {\n  return notas.filter((n) => n >= 6);\n}\n\nconsole.log(aprobados([4, 8, 6, 3, 10]));" },
    { id: "ex17b", title: "Nombres en mayúsculas", lang: "js",
      text: "Escribe <code>nombresMayus(personas)</code> que reciba un arreglo de objetos <code>{ nombre, edad }</code> y devuelva un arreglo con los nombres en mayúsculas de quienes tienen 18 años o más.",
      starter: "function nombresMayus(personas) {\n  \n}\n\nconsole.log(nombresMayus([{ nombre: \"ana\", edad: 20 }, { nombre: \"leo\", edad: 15 }]));",
      tests: [{ expr: "nombresMayus([{ nombre: \"ana\", edad: 20 }, { nombre: \"leo\", edad: 15 }])", expect: ["ANA"] }, { expr: "nombresMayus([{ nombre: \"sol\", edad: 18 }, { nombre: \"max\", edad: 40 }])", expect: ["SOL", "MAX"] }],
      hint: "Encadena: personas.filter(p => p.edad >= 18).map(p => p.nombre.toUpperCase())",
      solution: "function nombresMayus(personas) {\n  return personas\n    .filter((p) => p.edad >= 18)\n    .map((p) => p.nombre.toUpperCase());\n}\n\nconsole.log(nombresMayus([{ nombre: \"ana\", edad: 20 }, { nombre: \"leo\", edad: 15 }]));" },
    { id: "ex17c", title: "Total del carrito", lang: "js",
      text: "Escribe <code>totalCarrito(items)</code> que reciba un arreglo de objetos <code>{ precio, cantidad }</code> y devuelva el total a pagar.",
      starter: "function totalCarrito(items) {\n  \n}\n\nconsole.log(totalCarrito([{ precio: 10, cantidad: 3 }, { precio: 5, cantidad: 2 }]));",
      tests: [{ expr: "totalCarrito([{ precio: 10, cantidad: 3 }, { precio: 5, cantidad: 2 }])", expect: 40 }, { expr: "totalCarrito([])", expect: 0 }],
      hint: "items.reduce((total, it) => total + it.precio * it.cantidad, 0)",
      solution: "function totalCarrito(items) {\n  return items.reduce((total, it) => total + it.precio * it.cantidad, 0);\n}\n\nconsole.log(totalCarrito([{ precio: 10, cantidad: 3 }, { precio: 5, cantidad: 2 }]));" },
  ]
});

</script>
<script>

L({
  id: "l18", module: "m5", title: "Las herramientas del oficio", minutes: 30,
  summary: "Editor, terminal, Git y GitHub, cómo buscar ayuda y cómo usar la IA para aprender.",
  sections: [
    { h: "Tu editor de código", body: `
<p>Para programar en serio necesitas una computadora (en el móvil se aprende la lógica, pero se trabaja en una PC o notebook, no hace falta que sea potente). El editor más usado del mundo es <b>Visual Studio Code</b> (VS Code): gratuito, para Windows, Mac y Linux.</p>
<p>Lo que te da: colores en el código, autocompletado, aviso de errores mientras escribes, un depurador como el <b>Paso a paso</b> de esta app, y extensiones para cualquier lenguaje.</p>
${TIP("Primer paso concreto: instala VS Code y Node.js (desde nodejs.org). Crea un archivo <code>hola.js</code> con <code>console.log(\"Hola\")</code> y ejecútalo en la terminal con <code>node hola.js</code>. ¡Ya estás programando como un profesional!")}` },
    { h: "La terminal", body: `
<p>La <b>terminal</b> (o consola, o línea de comandos) es una forma de usar la computadora escribiendo comandos en lugar de hacer clic. Al principio impresiona, pero se usan pocos comandos:</p>
${TABLE(["Comando", "Qué hace"], [["<code>pwd</code>", "Muestra en qué carpeta estás"], ["<code>ls</code> (o <code>dir</code> en Windows)", "Lista los archivos"], ["<code>cd carpeta</code>", "Entra a una carpeta"], ["<code>cd ..</code>", "Sube una carpeta"], ["<code>mkdir nombre</code>", "Crea una carpeta"], ["<code>node archivo.js</code>", "Ejecuta un programa JavaScript"]])}` },
    { h: "Git y GitHub", body: `
<p><b>Git</b> es un sistema de control de versiones: guarda «fotos» (llamadas <b>commits</b>) de tu proyecto a lo largo del tiempo. Si rompes algo, vuelves atrás. Si trabajas en equipo, permite combinar el trabajo de varias personas.</p>
<p><b>GitHub</b> es un sitio web donde se guardan proyectos con Git. Es, además, tu <b>portafolio</b>: las empresas miran tu GitHub para ver qué sabes hacer.</p>
${CN(`git init                  # empezar a usar git en una carpeta
git add .                 # preparar los cambios
git commit -m "mensaje"   # guardar una foto con un mensaje
git push                  # subir a GitHub`, "none")}
${PRO("En prácticamente todas las empresas de software se usa Git todos los días. Saber usarlo es tan básico como saber programar. Aprende al menos: <code>clone</code>, <code>add</code>, <code>commit</code>, <code>push</code>, <code>pull</code> y qué es una <b>rama</b> (branch) y un <b>pull request</b>.")}` },
    { h: "Cómo buscar ayuda", body: `
<p>Nadie memoriza todo. Una habilidad profesional clave es <b>saber buscar</b>:</p>
<ol><li><b>Lee el mensaje de error completo.</b> Copia la parte importante y búscala tal cual.</li><li><b>Busca en inglés</b> cuando puedas: hay 10 veces más respuestas. «javascript sort array of numbers» encuentra todo.</li><li><b>Documentación oficial:</b> para JavaScript, <b>MDN Web Docs</b> (developer.mozilla.org) tiene todo, también en español.</li><li><b>Stack Overflow:</b> preguntas y respuestas de programadores. Casi siempre alguien tuvo tu mismo problema.</li></ol>` },
    { h: "La IA como tutor (y no como muleta)", body: `
<p>Herramientas como Claude pueden explicarte conceptos, revisar tu código y ayudarte a entender errores. Son excelentes para aprender <b>si las usas bien</b>:</p>
<ul><li>✔ Pide que te <b>explique</b> por qué falla tu código, no que te lo arregle.</li><li>✔ Pide <b>pistas</b> en vez de soluciones completas.</li><li>✔ Pide que te genere <b>ejercicios nuevos</b> para practicar un tema.</li><li>✔ Después de leer una solución, ciérrala y escríbela tú sin mirar.</li><li>✘ Copiar y pegar código que no entiendes: en una entrevista o en el trabajo lo vas a necesitar entender.</li></ul>
<p>En el Laboratorio de esta app tienes el botón <b>Pedir ayuda</b>, configurado para darte pistas y explicaciones sin resolverte el ejercicio.</p>
${PRO("Hoy los equipos profesionales usan IA a diario para escribir código más rápido. Lo que hace valioso a un programador es <b>entender</b> el código, saber si está bien, y saber qué pedir. Eso es exactamente lo que estás entrenando.")}` },
  ],
  cheat: [
    { h: "Para empezar en tu PC", body: `<ol><li>Instalar VS Code.</li><li>Instalar Node.js.</li><li>Crear cuenta en GitHub.</li><li>Instalar Git.</li></ol>` },
    { h: "Terminal", body: CN(`pwd   ls   cd carpeta   cd ..   mkdir nueva
node archivo.js`, "none") },
    { h: "Git", body: CN(`git clone URL
git add .
git commit -m "qué cambié"
git push
git pull`, "none") },
    { h: "Buscar ayuda", body: `Error completo → buscar en inglés → MDN → Stack Overflow → IA para que te <b>explique</b>.` },
  ],
  quiz: [
    { q: "¿Para qué sirve Git?", opts: ["Para diseñar páginas", "Para guardar versiones del código y trabajar en equipo", "Para ejecutar JavaScript", "Para buscar errores automáticamente"], a: 1, why: "Es un control de versiones: historial de cambios y colaboración." },
    { q: "¿Cuál es la mejor forma de usar la IA para aprender a programar?", opts: ["Pedir siempre la solución completa y copiarla", "Pedir explicaciones y pistas, y luego escribir el código uno mismo", "No usarla nunca", "Usarla solo para escribir comentarios"], a: 1, why: "Así aprendes de verdad y puedes usarla como acelerador más adelante." },
    { q: "¿Qué comando de terminal entra en una carpeta?", opts: ["ls", "pwd", "cd", "mkdir"], a: 2, why: "cd = change directory." },
    { q: "¿Dónde está la documentación más completa de JavaScript?", opts: ["MDN Web Docs", "Wikipedia", "Un foro cualquiera", "No existe"], a: 0, why: "MDN (developer.mozilla.org) es la referencia de la web." },
    { q: "¿Qué es un commit?", opts: ["Un error", "Una foto guardada del estado del proyecto con un mensaje", "Un lenguaje", "Una página web"], a: 1, why: "Cada commit registra los cambios en un momento dado." },
  ],
  exercises: []
});

L({
  id: "l19", module: "m5", title: "Tu ruta para dedicarte a esto", minutes: 25,
  summary: "Especialidades, un plan de estudio de 12 meses, proyectos para tu portafolio y cómo conseguir tu primer trabajo.",
  sections: [
    { h: "Especialidades", body: `
${TABLE(["Área", "Qué haces", "Tecnologías típicas"], [["<b>Frontend</b>", "La parte visible de webs y apps: lo que el usuario ve y toca", "HTML, CSS, JavaScript, React"], ["<b>Backend</b>", "Servidores, bases de datos, lógica de negocio", "Node.js, Python, Java, C#, SQL"], ["<b>Full stack</b>", "Frontend + backend", "Combinaciones de las anteriores"], ["<b>Móvil</b>", "Apps para Android e iOS", "React Native, Flutter, Kotlin, Swift"], ["<b>Datos</b>", "Analizar datos, reportes, inteligencia artificial", "Python, SQL, pandas"], ["<b>QA / Testing</b>", "Asegurar que el software funcione bien", "Testing manual y automatizado"]])}
<p>Un camino muy recomendado para empezar: <b>frontend con JavaScript</b>. Ves resultados visuales rápido (motiva), hay mucha demanda, y luego puedes ir hacia full stack.</p>` },
    { h: "Un plan de 12 meses", body: `
<p>Con constancia (1 a 2 horas por día) este es un ritmo realista:</p>
${TABLE(["Meses", "Qué estudiar", "Resultado"], [["1", "Esta app completa: lógica con pseudocódigo y bases de JavaScript", "Piensas como programador"], ["2–3", "HTML y CSS: estructura y diseño de páginas. Git y GitHub", "Páginas estáticas publicadas en GitHub Pages"], ["3–5", "JavaScript en el navegador: el DOM, eventos, fetch y APIs", "Páginas interactivas: calculadora, lista de tareas, app del clima"], ["5–8", "Un framework (React) y buenas prácticas", "2 o 3 proyectos completos en tu portafolio"], ["8–10", "Backend básico: Node.js, una base de datos, SQL", "Una app full stack sencilla"], ["10–12", "Portafolio, CV, LinkedIn, practicar entrevistas, postular", "Primeras entrevistas"]])}
${TIP("Recursos gratuitos excelentes: <b>freeCodeCamp</b> (en español), <b>MDN Web Docs</b>, <b>The Odin Project</b> y <b>JavaScript.info</b> (tiene versión en español).")}` },
    { h: "Proyectos para tu portafolio", body: `
