<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10191f">
</head>
<body style="margin:0">
<title>Código desde Cero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: app de una columna con barra inferior en móvil; en pantallas anchas la navegación pasa a un riel lateral. */
:root {
  --bg: #edf1f3;
  --surface: #ffffff;
  --surface-2: #f5f8f9;
  --ink: #13202a;
  --muted: #586874;
  --line: #d4dde2;
  --accent: #0a7a60;
  --accent-ink: #ffffff;
  --accent-soft: #d9efe7;
  --mark: #f2c230;
  --mark-soft: #fff4c7;
  --good: #137a3a;
  --good-soft: #dcf3e3;
  --bad: #b5401b;
  --bad-soft: #fbe5dc;
  --code-bg: #10191f;
  --code-ink: #dfe7ec;
  --code-line: #22313a;
  --code-muted: #6e8494;
  --t-kw: #6fd6bd;
  --t-str: #f3c96b;
  --t-num: #f7a6c4;
  --t-com: #6e8494;
  --t-ty: #9cc4ff;
  --t-fn: #c9b8ff;
  --t-op: #e7c9a0;
  --shadow: 0 1px 2px rgba(19, 32, 42, 0.06), 0 4px 16px rgba(19, 32, 42, 0.06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1215; --surface: #131c21; --surface-2: #19242a; --ink: #e4ecf0; --muted: #94a5b0; --line: #26343c;
    --accent: #3cc9a5; --accent-ink: #04201a; --accent-soft: #123a31; --mark: #f4c85a; --mark-soft: #3a3217;
    --good: #4fd17e; --good-soft: #143322; --bad: #ff8a65; --bad-soft: #3d1f16;
    --code-bg: #091014; --code-ink: #dfe7ec; --code-line: #1c2a32; --code-muted: #6e8494;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1215; --surface: #131c21; --surface-2: #19242a; --ink: #e4ecf0; --muted: #94a5b0; --line: #26343c;
  --accent: #3cc9a5; --accent-ink: #04201a; --accent-soft: #123a31; --mark: #f4c85a; --mark-soft: #3a3217;
  --good: #4fd17e; --good-soft: #143322; --bad: #ff8a65; --bad-soft: #3d1f16;
  --code-bg: #091014; --code-ink: #dfe7ec; --code-line: #1c2a32; --code-muted: #6e8494;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
code { font-family: var(--f-mono); font-size: 0.88em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0.05em 0.35em; white-space: nowrap; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Estructura ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--code-bg); color: var(--t-kw); font-family: var(--f-mono); font-weight: 700; font-size: 14px; display: grid; place-items: center; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="cloud"]::before { background: var(--good); }
.sync[data-s="saving"]::before { background: var(--mark); }

main, #lab { padding: 16px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); max-width: 860px; margin: 0 auto; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--nav-h); text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: 0.01em; border: 0; background: none; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { stroke-width: 2.4; }

@media (min-width: 980px) {
  .tabbar { top: 0; bottom: 0; right: auto; width: 96px; grid-template-columns: 1fr; grid-auto-rows: 84px; align-content: start; padding-top: 76px; border-top: 0; border-right: 1px solid var(--line); }
  .tab { height: auto; font-size: 12px; }
  .topbar { padding-left: 112px; }
  main, #lab { padding-left: 112px; padding-right: 24px; padding-bottom: 48px; max-width: 980px; }
}

/* ---------- Elementos comunes ---------- */
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.page-title { font-size: clamp(26px, 6vw, 36px); font-weight: 800; }
.lead { color: var(--muted); font-size: 17px; max-width: 62ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 0 10px; }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 8px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.done { background: var(--good-soft); border-color: transparent; color: var(--good); }
.chip.warn { background: var(--mark-soft); border-color: transparent; color: var(--ink); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 14px; z-index: 60; transition: 0.25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Inicio ---------- */
.hero { display: grid; gap: 14px; padding: 22px; border-radius: 16px; background: var(--code-bg); color: var(--code-ink); position: relative; overflow: hidden; }
.hero .eyebrow { color: var(--code-muted); }
.hero h1 { font-size: clamp(28px, 7vw, 40px); font-weight: 800; color: #fff; }
.hero p { color: #b8c6cf; max-width: 56ch; }
.hero .prompt { font-family: var(--f-mono); font-size: 13.5px; color: var(--t-kw); }
.hero .prompt .cursor { display: inline-block; width: 8px; height: 1.1em; background: var(--t-kw); vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero .btn.primary { background: var(--t-kw); border-color: var(--t-kw); color: #04201a; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 12.5px; color: var(--muted); }
.path { display: grid; gap: 0; }
.path-mod { display: grid; grid-template-columns: 34px 1fr; gap: 12px; text-decoration: none; color: inherit; padding-bottom: 18px; position: relative; }
.path-mod::before { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
.path-mod:last-child::before { display: none; }
.path-dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 13px; color: var(--muted); z-index: 1; }
.path-mod.done .path-dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.path-mod.current .path-dot { border-color: var(--accent); color: var(--accent); }
.path-mod h3 { font-size: 17px; }
.path-mod .dots { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.path-mod .dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.path-mod .dots i.on { background: var(--accent); }
.path-mod .dots i.ex { background: var(--mark); }

/* ---------- Lista de lecciones ---------- */
.mod-head { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; margin-top: 8px; }
.mod-head h2 { font-size: 21px; }
.lesson-list { display: grid; gap: 8px; }
.lesson-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: inherit; min-width: 0; }
.lesson-item:hover { border-color: var(--accent); }
.lesson-num { font-family: var(--f-mono); font-size: 13px; color: var(--muted); text-align: right; padding-right: 10px; border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; line-height: 2.2; }
.lesson-item.is-done .lesson-num { color: var(--accent); font-weight: 700; }
.lesson-item h3 { font-size: 16px; font-weight: 700; font-family: var(--f-body); letter-spacing: 0; }
.lesson-item p { font-size: 13.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.lesson-item > div { min-width: 0; }
.lesson-item.exam { background: var(--surface-2); border-style: dashed; }

/* ---------- Lección ---------- */
.lesson-head { display: grid; gap: 8px; padding-top: 4px; }
.lesson-body { display: grid; gap: 28px; }
.sec { display: grid; gap: 12px; }
.sec h2 { font-size: 22px; display: flex; gap: 10px; align-items: baseline; }
.sec h2 .n { font-family: var(--f-mono); font-size: 13px; color: var(--accent); font-weight: 700; }
.prose { display: grid; gap: 12px; max-width: 68ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.prose li::marker { color: var(--accent); }
.note { display: grid; gap: 4px; padding: 12px 14px; border-radius: 10px; border-left: 4px solid; font-size: 15px; }
.note b:first-child { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--f-mono); }
.note-tip { background: var(--accent-soft); border-color: var(--accent); }
.note-tip > b { color: var(--accent); }
.note-warn { background: var(--bad-soft); border-color: var(--bad); }
.note-warn > b { color: var(--bad); }
.note-pro { background: var(--surface-2); border-color: var(--ink); }
.note-idea { background: var(--mark-soft); border-color: var(--mark); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { background: var(--surface-2); font-size: 12.5px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td code { white-space: nowrap; }
pre.mini { font-family: var(--f-mono); background: var(--code-bg); color: var(--code-ink); padding: 8px 12px; border-radius: 8px; margin: 6px 0 0; font-size: 14px; overflow-x: auto; }

.codeblock { background: var(--code-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--code-line); min-width: 0; }
.cb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--code-line); }
.cb-head span { font-family: var(--f-mono); font-size: 11.5px; color: var(--code-muted); letter-spacing: 0.05em; text-transform: uppercase; }
.cb-head .acts { display: flex; gap: 4px; }
.cb-btn { border: 1px solid var(--code-line); background: transparent; color: var(--code-ink); font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 7px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; min-height: 32px; }
.cb-btn.run { background: var(--t-kw); color: #04201a; border-color: var(--t-kw); }
.codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.6; color: var(--code-ink); tab-size: 4; -moz-tab-size: 4; }
.t-kw { color: var(--t-kw); font-weight: 700; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; }
.t-ty { color: var(--t-ty); }
.t-fn { color: var(--t-fn); }
.t-op { color: var(--t-op); }

.lesson-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lesson-nav a { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; }
.lesson-nav a span { font-size: 12px; color: var(--muted); }
.lesson-nav a b { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-nav a.next { text-align: right; }
.toc { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.toc a { font-size: 13px; white-space: nowrap; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--muted); }

/* ---------- Quiz ---------- */
.quiz { display: grid; gap: 14px; }
.q { display: grid; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.q-title { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-weight: 700; }
.q-title .n { font-family: var(--f-mono); color: var(--accent); font-size: 14px; line-height: 1.6; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface-2); cursor: pointer; font-size: 15px; line-height: 1.45; min-height: 44px; }
.opt .k { width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .k { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.q.graded .opt { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: #fff; }
.fill { font-family: var(--f-mono); font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); width: 100%; min-height: 44px; }
.fill.right { border-color: var(--good); background: var(--good-soft); }
.fill.wrong { border-color: var(--bad); background: var(--bad-soft); }
.why { font-size: 14.5px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--muted); }
.q.ok .why { border-color: var(--good); }
.q.ko .why { border-color: var(--bad); }
.score { display: grid; gap: 8px; padding: 18px; border-radius: var(--r); text-align: center; }
.score.pass { background: var(--good-soft); }
.score.fail { background: var(--mark-soft); }
.score b { font-family: var(--f-display); font-size: 36px; font-variant-numeric: tabular-nums; }

/* ---------- Laboratorio ---------- */
.lab-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 0 14px; min-height: 36px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.challenge { display: grid; gap: 10px; border-left: 4px solid var(--mark); }
.challenge h3 { font-size: 18px; }
.challenge .text { font-size: 15px; }
.editor { position: relative; display: grid; grid-template-columns: auto 1fr; background: var(--code-bg); border: 1px solid var(--code-line); border-radius: 12px; overflow: hidden; height: min(52vh, 460px); min-height: 240px; }
.gutter { font-family: var(--f-mono); font-size: 14px; line-height: 24px; color: var(--code-muted); text-align: right; padding: 10px 8px 10px 10px; user-select: none; overflow: hidden; border-right: 1px solid var(--code-line); min-width: 40px; font-variant-numeric: tabular-nums; }
.gutter div.err { color: var(--bad); font-weight: 700; }
.gutter div.cur { color: var(--mark); font-weight: 700; }
.ed-wrap { position: relative; overflow: hidden; min-width: 0; }
.ed-wrap textarea, .ed-wrap pre { position: absolute; inset: 0; margin: 0; padding: 10px 12px; font-family: var(--f-mono); font-size: 14px; line-height: 24px; tab-size: 4; -moz-tab-size: 4; white-space: pre; overflow-wrap: normal; border: 0; letter-spacing: 0; }
.ed-wrap pre { color: var(--code-ink); pointer-events: none; overflow: hidden; }
.ed-wrap pre code { all: unset; font: inherit; white-space: pre; }
.ed-wrap textarea { width: 100%; height: 100%; background: transparent; color: transparent; caret-color: var(--t-kw); resize: none; outline: none; overflow: auto; }
.ed-wrap textarea::selection { background: rgba(111, 214, 189, 0.3); color: transparent; }
.line-mark { position: absolute; left: 0; right: 0; height: 24px; pointer-events: none; display: none; }
.line-mark.cur { background: rgba(244, 200, 90, 0.18); border-left: 3px solid var(--mark); }
.line-mark.err { background: rgba(255, 120, 90, 0.18); border-left: 3px solid var(--bad); }
@media (max-width: 600px) { .ed-wrap textarea, .ed-wrap pre, .gutter { font-size: 16px; } .editor { height: min(46vh, 420px); } }
.keys { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: thin; }

<script>
/* pseudo.js */
/* Intérprete de pseudocódigo en español (estilo PSeInt).
   Expone window.Pseudo = { parse, run, highlight, KEYWORDS }.
   Arreglos con índice base 0. Palabras clave sin distinguir mayúsculas ni tildes. */
(function (global) {
  "use strict";

  class PseError extends Error {
    constructor(msg, line) {
      super(msg);
      this.line = line;
    }
  }

  const strip = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const KEYWORDS = new Set([
    "algoritmo", "finalgoritmo", "proceso", "finproceso", "definir", "como", "dimension", "dimensionar",
    "escribir", "imprimir", "mostrar", "leer", "si", "entonces", "sino", "finsi",
    "segun", "hacer", "de", "finsegun", "mientras", "finmientras", "repetir",
    "hasta", "que", "para", "con", "finpara", "funcion", "finfuncion", "subproceso",
    "finsubproceso", "retornar", "por", "y", "o", "no", "mod", "verdadero",
    "falso", "borrar", "esperar", "limpiar"
  ]);
  /* Palabras con significado solo en cierto contexto: siguen siendo nombres válidos de variables. */

  const TYPES = {
    entero: "Entero", real: "Real", numero: "Real", numerico: "Real",
    cadena: "Cadena", texto: "Cadena", caracter: "Cadena", logico: "Logico", booleano: "Logico"
  };

  /* ---------------- Lexer ---------------- */
  function lex(src) {
    const toks = [];
    let i = 0, line = 1;
    const n = src.length;
    const push = (type, value, raw) => toks.push({ type, value, raw: raw ?? value, line });
    while (i < n) {
      const c = src[i];
      if (c === "\n") { push("NL", "\n"); line++; i++; continue; }
      if (c === " " || c === "\t" || c === "\r") { i++; continue; }
      if (c === "/" && src[i + 1] === "/") { while (i < n && src[i] !== "\n") i++; continue; }
      if (c === ";") { push("NL", ";"); i++; continue; }
      if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || ""))) {
        let j = i;
        while (j < n && /[0-9]/.test(src[j])) j++;
        if (src[j] === "." && /[0-9]/.test(src[j + 1] || "")) { j++; while (j < n && /[0-9]/.test(src[j])) j++; }
        else if (src[j] === "," && /[0-9]/.test(src[j + 1] || "") && false) { /* coma decimal no soportada */ }
        push("NUM", parseFloat(src.slice(i, j)), src.slice(i, j));
        i = j; continue;
      }
      if (c === '"' || c === "'" || c === "“" || c === "”") {
        const close = c === "“" ? "”" : c;
        let j = i + 1, s = "";
        while (j < n && src[j] !== close && !(close === "”" && src[j] === '"') && src[j] !== "\n") { s += src[j]; j++; }
        if (j >= n || src[j] === "\n") throw new PseError("Falta cerrar las comillas del texto que empieza con " + c + s.slice(0, 15) + "…", line);
        push("STR", s, src.slice(i, j + 1));
        i = j + 1; continue;
      }
      if (/[A-Za-z_À-ɏ]/.test(c)) {
        let j = i;
        while (j < n && /[A-Za-z0-9_À-ɏ]/.test(src[j])) j++;
        const raw = src.slice(i, j);
        const k = strip(raw);
        if (KEYWORDS.has(k)) push("KW", k, raw);
        else push("ID", raw.toLowerCase(), raw);
        i = j; continue;
      }
      const two = src.slice(i, i + 2);
      if (["<-", "<=", ">=", "<>", "!=", "==", "&&", "||", ":="].includes(two)) {
        push("OP", two === ":=" ? "<-" : two); i += 2; continue;
      }
      if (c === "←") { push("OP", "<-"); i++; continue; }
      if (c === "≤") { push("OP", "<="); i++; continue; }
      if (c === "≥") { push("OP", ">="); i++; continue; }
      if (c === "≠") { push("OP", "<>"); i++; continue; }
      if ("+-*/^%()[],:=<>&|~!".includes(c)) { push("OP", c); i++; continue; }
      throw new PseError("No entiendo el símbolo '" + c + "'", line);
    }
    push("NL", "\n");
    push("EOF", null);
    return toks;
  }

  /* ---------------- Parser ---------------- */
  function parse(src) {
    const t = lex(src);
    let p = 0;
    const peek = (o = 0) => t[p + o];
    const next = () => t[p++];
    const isKW = (k, o = 0) => peek(o).type === "KW" && peek(o).value === k;
    const isOP = (v, o = 0) => peek(o).type === "OP" && peek(o).value === v;
    const isW = (w, o = 0) => (peek(o).type === "ID" || peek(o).type === "KW") && strip(peek(o).raw) === w;
    function expectW(w, ctx) {
      if (!isW(w)) throw new PseError("Esperaba '" + w + "'" + (ctx ? " " + ctx : "") + " pero encontré " + show(peek()), peek().line);
      return next();
    }
    const show = (tok) => tok.type === "NL" ? "el final de la línea" : tok.type === "EOF" ? "el final del programa" : "'" + tok.raw + "'";
    function expectKW(k, ctx) {
      if (!isKW(k)) throw new PseError("Esperaba '" + nice(k) + "'" + (ctx ? " " + ctx : "") + " pero encontré " + show(peek()), peek().line);
      return next();
    }
    function expectOP(v, ctx) {
      if (!isOP(v)) throw new PseError("Esperaba '" + v + "'" + (ctx ? " " + ctx : "") + " pero encontré " + show(peek()), peek().line);
      return next();
    }
    function endLine() {
      if (peek().type !== "NL" && peek().type !== "EOF") throw new PseError("Sobra " + show(peek()) + " al final de la instrucción", peek().line);
      skipNL();
    }
    function skipNL() { while (peek().type === "NL") next(); }
    function ident(ctx) {
      const tok = peek();
      if (tok.type !== "ID") {
        if (tok.type === "KW") throw new PseError("'" + tok.raw + "' es una palabra reservada y no se puede usar como nombre" + (ctx ? " " + ctx : ""), tok.line);
        throw new PseError("Esperaba un nombre" + (ctx ? " " + ctx : "") + " pero encontré " + show(tok), tok.line);
      }
      next();
      return tok;
    }

    const functions = {};
    let main = null;
    const loose = [];

    skipNL();
    while (peek().type !== "EOF") {
      if (isKW("algoritmo") || isKW("proceso")) {
        const start = next();
        const endKw = start.value === "algoritmo" ? "finalgoritmo" : "finproceso";
        let name = "programa";
        if (peek().type === "ID" || peek().type === "KW") name = next().raw;
        endLine();
        const body = block([endKw], "el '" + start.raw + "' de la línea " + start.line);
        expectKW(endKw); endLine();
        if (main) throw new PseError("Solo puede haber un Algoritmo principal", start.line);
        main = { name, body, line: start.line };
      } else if (isKW("funcion") || isKW("subproceso")) {
        const f = funcDef();
        if (functions[f.name]) throw new PseError("La función '" + f.raw + "' ya está definida", f.line);
        functions[f.name] = f;
      } else {
        loose.push(statement());
      }
    }
    if (!main) main = { name: "programa", body: loose, line: 1 };
    else if (loose.length) throw new PseError("Hay instrucciones fuera del Algoritmo", loose[0].line);
    return { main, functions };

    function nice(k) {
      const map = { finsi: "FinSi", finmientras: "FinMientras", finpara: "FinPara", finsegun: "FinSegun", finfuncion: "FinFuncion", finalgoritmo: "FinAlgoritmo", finproceso: "FinProceso", finsubproceso: "FinSubProceso", entonces: "Entonces", hacer: "Hacer", hasta: "Hasta", que: "Que", como: "Como" };
      return map[k] || k;
    }

    function funcDef() {
      const start = next();
      const endKw = start.value === "funcion" ? "finfuncion" : "finsubproceso";
      let retVar = null;
      let nameTok = ident("para la función");
      if (isOP("<-") || isOP("=")) { next(); retVar = nameTok.value; nameTok = ident("para la función"); }
      const params = [];
      if (isOP("(")) {
        next();
        if (!isOP(")")) {
          do {
            const pt = ident("de parámetro");
            let byRef = false;
            if (isKW("por")) { next(); if (isW("referencia")) { next(); byRef = true; } else expectW("valor"); }
            params.push({ name: pt.value, byRef });
          } while (isOP(",") && next());
        }
        expectOP(")", "para cerrar los parámetros");
      }
      endLine();
      const body = block([endKw, start.value === "funcion" ? "finsubproceso" : "finfuncion"], "la función '" + nameTok.raw + "' de la línea " + start.line);
      next(); endLine();
      return { name: nameTok.value, raw: nameTok.raw, retVar, params, body, line: start.line };
    }

    function block(enders, ctx) {
      const out = [];
      skipNL();
      while (true) {
        const tk = peek();
        if (tk.type === "EOF") throw new PseError("Falta '" + nice(enders[0]) + "' para cerrar " + ctx, tk.line);
        if (tk.type === "KW" && enders.includes(tk.value)) break;
        if (tk.type === "KW" && ["finsi", "finmientras", "finpara", "finsegun", "finfuncion", "finalgoritmo", "finproceso", "sino", "hasta"].includes(tk.value) && !enders.includes(tk.value)) {
          throw new PseError("Encontré '" + tk.raw + "' pero esperaba '" + nice(enders[0]) + "' para cerrar " + ctx, tk.line);
        }
        out.push(statement());
      }
      return out;
    }

    function statement() {
      const tk = peek();
      const line = tk.line;
      if (tk.type === "KW") {
        switch (tk.value) {
          case "definir": {
            next();
            const names = [];
            do { names.push(ident("de variable").value); } while (isOP(",") && next());
            expectKW("como", "después de los nombres de variables");
            const ty = next();
            if ((ty.type !== "KW" && ty.type !== "ID") || !TYPES[strip(ty.raw)]) throw new PseError("Tipo desconocido " + show(ty) + ". Usa Entero, Real, Cadena o Logico", ty.line);
            endLine();
            return { k: "def", names, type: TYPES[strip(ty.raw)], line };
          }
          case "dimension": case "dimensionar": {
            next();
            const items = [];
            do {
              const nm = ident("del arreglo");
              expectOP("[", "después del nombre del arreglo");
              const dims = [expr()];
              while (isOP(",")) { next(); dims.push(expr()); }
              expectOP("]", "para cerrar el tamaño");
              items.push({ name: nm.value, dims });
            } while (isOP(",") && next());
            endLine();
            return { k: "dim", items, line };
          }
          case "escribir": case "imprimir": case "mostrar": {
            next();
            let nl = true;
            if (isW("sin") && isW("saltar", 1)) { next(); next(); nl = false; }
            const items = [];
            if (peek().type !== "NL") {
              do { items.push(expr()); } while (isOP(",") && next());
            }
            if (isW("sin") && isW("saltar", 1)) { next(); next(); nl = false; }
            endLine();
            return { k: "write", items, nl, line };
          }
          case "leer": {
            next();
            const targets = [];
            do { targets.push(lvalue()); } while (isOP(",") && next());
            endLine();
            return { k: "read", targets, line };
          }
          case "si": {
            next();
            const cond = expr();
            if (!isKW("entonces")) {
              if (peek().type === "NL") throw new PseError("Falta 'Entonces' después de la condición del Si", line);
              throw new PseError("Esperaba 'Entonces' después de la condición pero encontré " + show(peek()), peek().line);
            }
            next(); skipNL();
            const then = block(["finsi", "sino"], "el 'Si' de la línea " + line);
            let els = null;
            if (isKW("sino")) { next(); skipNL(); els = block(["finsi"], "el 'Si' de la línea " + line); }
            expectKW("finsi"); endLine();
            return { k: "if", cond, then, els, line };
          }
          case "segun": {
            next();
            const subject = expr();
            expectKW("hacer", "después de la variable del Segun");
            endLine();
            const cases = [];
            let def = null;
            let current = null;
            while (true) {
              const k = peek();
              if (k.type === "EOF") throw new PseError("Falta 'FinSegun' para cerrar el 'Segun' de la línea " + line, k.line);
              if (isKW("finsegun")) break;
              if (isKW("de") && isW("otro", 1)) {
                next(); next(); expectW("modo"); expectOP(":", "después de 'De Otro Modo'"); skipNL();
                def = []; current = def; continue;
              }
              const save = p;
              let labels = null;
              try {
                if (isW("caso") && peek(1).type !== "OP") next();
                const ls = [expr()];
                while (isOP(",")) { next(); ls.push(expr()); }
                if (isOP(":")) { next(); labels = ls; } else p = save;
              } catch (e) { p = save; }
              if (labels) { current = { labels, body: [], line: k.line }; cases.push(current); skipNL(); continue; }
              if (!current) throw new PseError("Dentro del Segun cada opción empieza con un valor y dos puntos, por ejemplo  1:", k.line);
              (current.body || current).push(statement());
            }
            expectKW("finsegun"); endLine();
            return { k: "switch", subject, cases, def, line };
          }
          case "mientras": {
            next();
            const cond = expr();
            expectKW("hacer", "después de la condición del Mientras");
            endLine();
            const body = block(["finmientras"], "el 'Mientras' de la línea " + line);
            next(); endLine();
            return { k: "while", cond, body, line };
          }
          case "repetir": {
            next(); endLine();
            const body = block(["hasta", "mientras"], "el 'Repetir' de la línea " + line);
            let negate = false;
            if (isKW("hasta")) { next(); expectKW("que", "después de 'Hasta'"); }
            else { next(); expectKW("que", "después de 'Mientras'"); negate = true; }
            const cond = expr();
            endLine();
            return { k: "repeat", body, cond, negate, line };
          }
          case "para": {
            next();
            const v = ident("para la variable del Para");
            if (!isOP("<-") && !isOP("=")) throw new PseError("En el Para escribe  variable <- inicio Hasta fin", peek().line);
            next();
            const from = expr();
            expectKW("hasta", "en el Para");
            const to = expr();
            let step = null;
            if (isKW("con")) { next(); expectW("paso"); step = expr(); }
            expectKW("hacer", "al final de la línea del Para");
            endLine();
            const body = block(["finpara"], "el 'Para' de la línea " + line);
            next(); endLine();
            return { k: "for", v: v.value, from, to, step, body, line };
          }
          case "retornar": {
            next();
            const e = peek().type === "NL" ? null : expr();
            endLine();
            return { k: "return", e, line };
          }
          case "borrar": case "limpiar": {
            next(); expectW("pantalla"); endLine();
            return { k: "cls", line };
          }
          case "esperar": {
            next();
            if (isW("tecla")) { next(); endLine(); return { k: "waitkey", line }; }
            const e = expr();
            if (isW("segundos") || isW("segundo")) next();
            endLine();
            return { k: "wait", e, line };
          }
          case "sino": throw new PseError("'SiNo' sin un 'Si' que lo abra", line);
          case "finsi": case "finmientras": case "finpara": case "finsegun": case "finfuncion": case "finalgoritmo": case "finproceso":
            throw new PseError("'" + tk.raw + "' no cierra nada: revisa que cada bloque tenga su apertura", line);
          case "funcion": case "subproceso":
            throw new PseError("Las funciones se definen fuera del Algoritmo (antes o después)", line);
          case "algoritmo": case "proceso":
            throw new PseError("No se puede abrir un Algoritmo dentro de otro", line);
          default:
            if (["y", "o", "no", "mod", "verdadero", "falso"].includes(tk.value))
              throw new PseError("'" + tk.raw + "' es una palabra reservada del pseudocódigo y no puede usarse como nombre de variable. Prueba con otro nombre, por ejemplo " + tk.raw + "1 o valor_" + tk.raw, line);
            throw new PseError("No esperaba '" + tk.raw + "' al inicio de una instrucción", line);
        }
      }
      if (tk.type === "ID") {
        if (isOP("(", 1)) {
          const save = p;
          const call = primary();
          if (peek().type === "NL" || peek().type === "EOF") { endLine(); return { k: "callst", call, line }; }
          p = save;
        }
        const target = lvalue();
        if (isOP("<-") || isOP("=")) {
          next();
          const e = expr();
          endLine();
          return { k: "assign", target, e, line };
        }
        if (peek().type === "NL") throw new PseError("La instrucción '" + tk.raw + "' está incompleta. Para guardar un valor usa  " + tk.raw + " <- valor", line);
        throw new PseError("Esperaba '<-' para asignar un valor a '" + tk.raw + "' pero encontré " + show(peek()), peek().line);
      }
      throw new PseError("No esperaba " + show(tk) + " al inicio de una instrucción", line);
    }

    function lvalue() {
      const nm = ident("de variable");
      if (isOP("[")) {
        next();
        const idx = [expr()];
        while (isOP(",")) { next(); idx.push(expr()); }
        expectOP("]", "para cerrar el índice");
        return { k: "idx", name: nm.value, raw: nm.raw, idx, line: nm.line };
      }
      return { k: "var", name: nm.value, raw: nm.raw, line: nm.line };
    }

    function expr() { return orE(); }
    function orE() {
      let l = andE();
      while (isKW("o") || isOP("||") || isOP("|")) { const op = next(); l = { k: "bin", op: "o", l, r: andE(), line: op.line }; }
      return l;
    }
    function andE() {
      let l = notE();
      while (isKW("y") || isOP("&&") || isOP("&")) { const op = next(); l = { k: "bin", op: "y", l, r: notE(), line: op.line }; }
      return l;
    }
    function notE() {
      if (isKW("no") || isOP("~") || isOP("!")) { const op = next(); return { k: "un", op: "no", e: notE(), line: op.line }; }
      return cmpE();
    }
    function cmpE() {
      let l = addE();
      while (peek().type === "OP" && ["=", "==", "<>", "!=", "<", ">", "<=", ">="].includes(peek().value)) {
        const op = next();
        let o = op.value; if (o === "==") o = "="; if (o === "!=") o = "<>";
        l = { k: "bin", op: o, l, r: addE(), line: op.line };
      }
      return l;
    }
    function addE() {
      let l = mulE();
      while (isOP("+") || isOP("-")) { const op = next(); l = { k: "bin", op: op.value, l, r: mulE(), line: op.line }; }
      return l;
    }
    function mulE() {
      let l = unE();
      while (isOP("*") || isOP("/") || isOP("%") || isKW("mod")) {
        const op = next();
        l = { k: "bin", op: op.value === "%" || op.value === "mod" ? "mod" : op.value, l, r: unE(), line: op.line };
      }
      return l;
    }
    function unE() {
      if (isOP("-")) { const op = next(); return { k: "un", op: "-", e: unE(), line: op.line }; }
      if (isOP("+")) { next(); return unE(); }
      return powE();
    }
    function powE() {
      const b = primary();
      if (isOP("^")) { const op = next(); return { k: "bin", op: "^", l: b, r: unE(), line: op.line }; }
      return b;
    }
    function primary() {
      const tk = peek();
      if (tk.type === "NUM") { next(); return { k: "lit", v: tk.value, line: tk.line }; }
      if (tk.type === "STR") { next(); return { k: "lit", v: tk.value, line: tk.line }; }
      if (tk.type === "KW" && (tk.value === "verdadero" || tk.value === "falso")) { next(); return { k: "lit", v: tk.value === "verdadero", line: tk.line }; }
      if (isOP("(")) {
        next();
        const e = expr();
        expectOP(")", "para cerrar el paréntesis");
        return e;
      }
      if (tk.type === "ID") {
        next();
        if (isOP("(")) {
          next();
          const args = [];
          if (!isOP(")")) { do { args.push(expr()); } while (isOP(",") && next()); }
          expectOP(")", "para cerrar la llamada a " + tk.raw);
          return { k: "call", name: tk.value, raw: tk.raw, args, line: tk.line };
        }
        if (isOP("[")) {
          next();
          const idx = [expr()];
          while (isOP(",")) { next(); idx.push(expr()); }
          expectOP("]", "para cerrar el índice");
          return { k: "idx", name: tk.value, raw: tk.raw, idx, line: tk.line };
        }
        return { k: "var", name: tk.value, raw: tk.raw, line: tk.line };
      }
      if (tk.type === "KW") throw new PseError("'" + tk.raw + "' es una palabra reservada; aquí esperaba un valor o una variable", tk.line);
      throw new PseError("Esperaba un valor pero encontré " + show(tk), tk.line);
    }
  }

  /* ---------------- Runtime ---------------- */
  const RETURN = Symbol("return");

  function fmt(v) {
    if (typeof v === "boolean") return v ? "VERDADERO" : "FALSO";
    if (typeof v === "number") {
      if (!isFinite(v)) return v > 0 ? "Infinito" : v < 0 ? "-Infinito" : "Indefinido";
      if (Number.isInteger(v)) return String(v);
      return String(Number(v.toFixed(8)));
    }
    if (v && v.kind === "array") return "[" + v.data.map((x) => x === undefined ? "?" : fmt(x)).join(", ") + "]";
    return String(v);
  }
  function typeOf(v) {
    if (typeof v === "number") return Number.isInteger(v) ? "Entero" : "Real";
    if (typeof v === "string") return "Cadena";
    if (typeof v === "boolean") return "Logico";
    if (v && v.kind === "array") return "Arreglo";
    return "?";
  }
  const typeName = (v) => ({ Entero: "un número entero", Real: "un número real", Cadena: "un texto", Logico: "un valor lógico", Arreglo: "un arreglo" })[typeOf(v)] || "un valor";

  function makeScope(parent) { return { vars: new Map(), parent }; }

  async function run(program, io, opts = {}) {
    const maxSteps = opts.maxSteps ?? 2000000;
    let steps = 0;
    let stopped = false;
    const globalScope = makeScope(null);
    const callStack = [];
    const control = { stop: () => { stopped = true; } };
    if (opts.onControl) opts.onControl(control);

    async function tick(node, scope) {
      if (stopped) throw new PseError("Ejecución detenida", node.line);
      steps++;
      if (steps > maxSteps) throw new PseError("El programa ejecutó demasiadas instrucciones. ¿Hay un bucle infinito? Revisa que la condición del bucle llegue a cambiar.", node.line);
      if (opts.onStep) { const w = opts.onStep(node.line, () => snapshot(scope)); if (w) await w; }
      if (steps % 4000 === 0) await new Promise((r) => setTimeout(r, 0));
    }

    function snapshot(scope) {
      const out = [];
      for (const [name, cell] of scope.vars) {
        out.push({ name: cell.raw || name, type: cell.arr ? "Arreglo de " + (cell.type || "?") : (cell.type || (cell.value === undefined ? "?" : typeOf(cell.value))), value: cell.value === undefined ? "(sin valor)" : fmt(cell.value) });
      }
      return { fn: callStack.length ? callStack[callStack.length - 1] : null, vars: out };
    }

    function lookup(scope, name) { return scope.vars.get(name); }

    function coerce(cell, v, line, label) {
      if (v && v.kind === "array" && !cell.arr) {
        cell.arr = true;
        return v;
      }
      const ty = cell.type;
      if (!ty) return v;
      if (ty === "Entero") {
        if (typeof v !== "number") throw new PseError("'" + label + "' es Entero y le intentaste guardar " + typeName(v) + " (" + fmt(v) + ")", line);
        if (!Number.isInteger(v)) throw new PseError("'" + label + "' es Entero y no puede guardar " + fmt(v) + ". Usa trunc() o redon(), o defínela como Real", line);
      } else if (ty === "Real") {
        if (typeof v !== "number") throw new PseError("'" + label + "' es Real (número) y le intentaste guardar " + typeName(v) + " (" + fmt(v) + ")", line);
      } else if (ty === "Cadena") {
        if (typeof v !== "string") throw new PseError("'" + label + "' es Cadena (texto) y le intentaste guardar " + typeName(v) + " (" + fmt(v) + "). Escribe el valor entre comillas o usa ConvertirATexto()", line);
      } else if (ty === "Logico") {
        if (typeof v !== "boolean") throw new PseError("'" + label + "' es Logico y solo guarda VERDADERO o FALSO, no " + fmt(v), line);
      }
      return v;
    }

    function arrIndex(cell, idxVals, node) {
      const a = cell.value;
      if (!a || a.kind !== "array") throw new PseError("'" + node.raw + "' no es un arreglo. Créalo antes con  Dimension " + node.raw + "[tamaño]", node.line);
      if (idxVals.length !== a.dims.length) throw new PseError("'" + node.raw + "' tiene " + a.dims.length + " dimensión(es) y usaste " + idxVals.length + " índice(s)", node.line);
      let flat = 0;
      for (let d = 0; d < a.dims.length; d++) {
        const iv = idxVals[d];
        if (typeof iv !== "number" || !Number.isInteger(iv)) throw new PseError("El índice de '" + node.raw + "' debe ser un número entero, no " + fmt(iv), node.line);
        if (iv < 0 || iv >= a.dims[d]) throw new PseError("Índice " + iv + " fuera de rango: '" + node.raw + "' tiene posiciones de 0 a " + (a.dims[d] - 1), node.line);
        flat = flat * a.dims[d] + iv;
      }
      return flat;
    }

    async function evalE(e, scope) {
      switch (e.k) {
        case "lit": return e.v;
        case "var": {
          const cell = lookup(scope, e.name);
          if (!cell) {
            if (BUILTINS[strip(e.name)] && BUILTINS[strip(e.name)].length === 0) return BUILTINS[strip(e.name)]();
            throw new PseError("La variable '" + e.raw + "' no existe todavía. Dale un valor antes de usarla (" + e.raw + " <- ...) o léela con Leer", e.line);
          }
          if (cell.value === undefined) throw new PseError("La variable '" + e.raw + "' fue definida pero todavía no tiene valor", e.line);
          return cell.value;
        }
        case "idx": {
          const cell = lookup(scope, e.name);
          if (!cell) throw new PseError("El arreglo '" + e.raw + "' no existe. Créalo con  Dimension " + e.raw + "[tamaño]", e.line);
          const idx = [];
          for (const x of e.idx) idx.push(await getVal(x, scope));
          const f = arrIndex(cell, idx, e);
          const v = cell.value.data[f];
          if (v === undefined) throw new PseError("La posición " + e.raw + "[" + idx.join(",") + "] todavía no tiene valor", e.line);
          return v;
        }
        case "un": {
          const v = await getVal(e.e, scope);
          if (e.op === "-") { if (typeof v !== "number") throw new PseError("No se puede poner signo negativo a " + typeName(v), e.line); return -v; }
          if (typeof v !== "boolean") throw new PseError("NO solo funciona con valores lógicos (VERDADERO/FALSO), no con " + typeName(v), e.line);
          return !v;
        }
        case "bin": {
          if (e.op === "y" || e.op === "o") {
            const l = await getVal(e.l, scope);
            if (typeof l !== "boolean") throw new PseError("'" + (e.op === "y" ? "Y" : "O") + "' necesita condiciones (VERDADERO/FALSO) a ambos lados, no " + typeName(l), e.line);
            if (e.op === "y" && !l) return false;
            if (e.op === "o" && l) return true;
            const r = await getVal(e.r, scope);
            if (typeof r !== "boolean") throw new PseError("'" + (e.op === "y" ? "Y" : "O") + "' necesita condiciones (VERDADERO/FALSO) a ambos lados, no " + typeName(r), e.line);
            return r;
          }
          const l = await getVal(e.l, scope);
          const r = await getVal(e.r, scope);
          return binop(e.op, l, r, e.line);
        }
        case "call": return callFn(e, scope);
      }
      throw new PseError("Expresión desconocida", e.line);
    }

    function binop(op, l, r, line) {
      const num = (x) => typeof x === "number";
      switch (op) {
        case "+":
          if (num(l) && num(r)) return l + r;
          if (typeof l === "string" || typeof r === "string") return fmt(l) + fmt(r);
          throw new PseError("No se puede sumar " + typeName(l) + " con " + typeName(r), line);
        case "-": case "*": case "/": case "^": case "mod": {
          if (!num(l) || !num(r)) throw new PseError("La operación '" + (op === "mod" ? "MOD" : op) + "' necesita números, pero recibió " + typeName(num(l) ? r : l) + " (" + fmt(num(l) ? r : l) + ")", line);
          if (op === "-") return l - r;
          if (op === "*") return l * r;
          if (op === "^") return Math.pow(l, r);
          if (r === 0) throw new PseError(op === "/" ? "División por cero: no se puede dividir entre 0" : "MOD entre 0 no está definido", line);
          if (op === "/") return l / r;
          return l - r * Math.trunc(l / r);
        }
        case "=": case "<>": case "<": case ">": case "<=": case ">=": {
          if (typeof l !== typeof r) throw new PseError("No se puede comparar " + typeName(l) + " con " + typeName(r) + " (" + fmt(l) + " y " + fmt(r) + ")", line);
          if (typeof l === "boolean" && !["=", "<>"].includes(op)) throw new PseError("Los valores lógicos solo se comparan con = o <>", line);
          switch (op) {
            case "=": return l === r;
            case "<>": return l !== r;
            case "<": return l < r;
            case ">": return l > r;
            case "<=": return l <= r;
            case ">=": return l >= r;
          }
        }
      }
      throw new PseError("Operador desconocido " + op, line);
    }

    async function callFn(e, scope) {
      const key = strip(e.name);
      const f = program.functions[e.name];
      if (!f) {
        const b = BUILTINS[key];
        if (!b) throw new PseError("No existe la función '" + e.raw + "'. Revisa cómo está escrita", e.line);
        const args = [];
        for (const a of e.args) args.push(await getVal(a, scope));
        try { return b(...args); } catch (err) { throw new PseError(err.message, e.line); }
      }
      if (e.args.length !== f.params.length) throw new PseError("'" + f.raw + "' recibe " + f.params.length + " dato(s) y le pasaste " + e.args.length, e.line);
      if (callStack.length > 200) throw new PseError("Demasiadas llamadas anidadas a funciones (¿una función que se llama a sí misma sin parar?)", e.line);
      const local = makeScope(null);
      for (let i = 0; i < f.params.length; i++) {
        const prm = f.params[i];
        const a = e.args[i];
        if (prm.byRef) {
          if (a.k !== "var") throw new PseError("El parámetro '" + prm.name + "' es Por Referencia y necesita una variable, no una expresión", e.line);
          let cell = lookup(scope, a.name);
          if (!cell) { cell = { value: undefined, raw: a.raw }; scope.vars.set(a.name, cell); }
          local.vars.set(prm.name, cell);
        } else {
          const v = await getVal(a, scope);
          local.vars.set(prm.name, { value: v, arr: v && v.kind === "array", raw: prm.name });
        }
      }
      if (f.retVar && !local.vars.has(f.retVar)) local.vars.set(f.retVar, { value: undefined, raw: f.retVar });
      callStack.push(f.raw);
      let ret;
      try {
        const r = await execBlock(f.body, local);
        if (r && r.t === RETURN) ret = r.v;
      } finally { callStack.pop(); }
      if (ret === undefined && f.retVar) ret = local.vars.get(f.retVar).value;
      return ret === undefined ? NO_VALUE(f, e) : ret;
    }
    function NO_VALUE(f, e) {
      return { kind: "novalue", f: f.raw, line: e.line };
    }

    async function getVal(e, scope) {
      const v = await evalE(e, scope);
      if (v && v.kind === "novalue") throw new PseError("La función '" + v.f + "' no devolvió ningún valor y se intentó usar su resultado", e.line);
      return v;
    }

    async function assign(target, v, scope, line) {
      if (v && v.kind === "novalue") throw new PseError("La función '" + v.f + "' no devolvió ningún valor", line);
      if (target.k === "var") {
        let cell = lookup(scope, target.name);
        if (!cell) { cell = { value: undefined, raw: target.raw }; scope.vars.set(target.name, cell); }
        if (cell.arr && !(v && v.kind === "array")) throw new PseError("'" + target.raw + "' es un arreglo; para guardar un valor indica la posición, por ejemplo " + target.raw + "[0]", line);
        cell.value = coerce(cell, v, line, target.raw);
        return;
      }
      const cell = lookup(scope, target.name);
      if (!cell) throw new PseError("El arreglo '" + target.raw + "' no existe. Créalo con  Dimension " + target.raw + "[tamaño]", line);
      const idx = [];
      for (const x of target.idx) idx.push(await getVal(x, scope));
      const f = arrIndex(cell, idx, target);
      cell.value.data[f] = coerce({ type: cell.type }, v, line, target.raw + "[" + idx.join(",") + "]");
    }

    function parseInput(s, type) {
      const t = s.trim();
      if (type === "Cadena") return s;
      if (type === "Entero" || type === "Real") {
        const n = Number(t.replace(",", "."));
        if (t === "" || isNaN(n)) return { bad: "un número" };
        if (type === "Entero" && !Number.isInteger(n)) return { bad: "un número entero" };
        return n;
      }
      if (type === "Logico") {
        const k = strip(t);
        if (["verdadero", "v", "si", "true", "1"].includes(k)) return true;
        if (["falso", "f", "no", "false", "0"].includes(k)) return false;
        return { bad: "VERDADERO o FALSO" };
      }
      if (t !== "" && !isNaN(Number(t.replace(",", ".")))) return Number(t.replace(",", "."));
      return s;
    }

    async function execBlock(stmts, scope) {
      for (const s of stmts) {
        const r = await exec(s, scope);
        if (r) return r;
      }
      return null;
    }

    async function exec(s, scope) {
      await tick(s, scope);
      switch (s.k) {
        case "def":
          for (const nm of s.names) {
            const cell = lookup(scope, nm);
            if (cell) {
              if (cell.type && cell.type !== s.type && !cell.arr) throw new PseError("La variable '" + nm + "' ya fue definida como " + cell.type, s.line);
              cell.type = s.type;
              if (cell.value !== undefined && !cell.arr) coerce(cell, cell.value, s.line, nm);
            } else scope.vars.set(nm, { value: undefined, type: s.type, raw: nm });
          }
          return null;
        case "dim":
          for (const it of s.items) {
            const dims = [];
            for (const d of it.dims) {
              const v = await getVal(d, scope);
              if (typeof v !== "number" || !Number.isInteger(v) || v < 1) throw new PseError("El tamaño del arreglo debe ser un entero mayor que 0, no " + fmt(v), s.line);
              if (v > 100000) throw new PseError("El arreglo es demasiado grande (máximo 100000 posiciones)", s.line);
              dims.push(v);
            }
            const total = dims.reduce((a, b) => a * b, 1);
            let cell = lookup(scope, it.name);
            if (!cell) { cell = { raw: it.name }; scope.vars.set(it.name, cell); }
            cell.arr = true;
            cell.value = { kind: "array", dims, data: new Array(total).fill(undefined) };
          }
          return null;
        case "write": {
          const parts = [];
          for (const e of s.items) parts.push(fmt(await getVal(e, scope)));
          io.write(parts.join(""), s.nl);
          return null;
        }
        case "read":
          for (const tgt of s.targets) {
            let type;
            const cell = lookup(scope, tgt.name);
            if (cell) type = cell.type;
            const raw = await io.read(tgt.raw);
            if (raw === null || raw === undefined) throw new PseError("El programa pidió un dato con Leer pero no hay más datos de entrada", s.line);
            let v = parseInput(String(raw), type);
            if (v && v.bad) throw new PseError("Se esperaba " + v.bad + " para '" + tgt.raw + "' pero se escribió \"" + raw + "\"", s.line);
            await assign(tgt, v, scope, s.line);
          }
          return null;
        case "assign": {
          const v = await getVal(s.e, scope);
          await assign(s.target, v, scope, s.line);
          return null;
        }
        case "callst": {
          await evalE(s.call, scope);
          return null;
        }
        case "if": {
          const c = await getVal(s.cond, scope);
          if (typeof c !== "boolean") throw new PseError("La condición del Si debe ser VERDADERO o FALSO, pero dio " + fmt(c) + ". ¿Usaste <- en lugar de = para comparar?", s.line);
          if (c) return execBlock(s.then, scope);
          if (s.els) return execBlock(s.els, scope);
          return null;
        }
        case "switch": {
          const v = await getVal(s.subject, scope);
          for (const c of s.cases) {
            for (const lbl of c.labels) {
              const lv = await getVal(lbl, scope);
              if (typeof lv === typeof v && lv === v) return execBlock(c.body, scope);
            }
          }
          if (s.def) return execBlock(s.def, scope);
          return null;
        }
        case "while": {
          while (true) {
            const c = await getVal(s.cond, scope);
            if (typeof c !== "boolean") throw new PseError("La condición del Mientras debe ser VERDADERO o FALSO, pero dio " + fmt(c), s.line);
            if (!c) break;
            const r = await execBlock(s.body, scope);
            if (r) return r;
            await tick(s, scope);
          }
          return null;
        }
        case "repeat": {
          while (true) {
            const r = await execBlock(s.body, scope);
            if (r) return r;
            const c = await getVal(s.cond, scope);
            if (typeof c !== "boolean") throw new PseError("La condición del Hasta Que debe ser VERDADERO o FALSO, pero dio " + fmt(c), s.line);
            if (s.negate ? !c : c) break;
            await tick(s, scope);
          }
          return null;
        }
        case "for": {
          const from = await getVal(s.from, scope);
          const to = await getVal(s.to, scope);
          const step = s.step ? await getVal(s.step, scope) : 1;
          if (typeof from !== "number" || typeof to !== "number" || typeof step !== "number") throw new PseError("El Para necesita números en inicio, fin y paso", s.line);
          if (step === 0) throw new PseError("El paso del Para no puede ser 0", s.line);
          const tv = { k: "var", name: s.v, raw: s.v };
          await assign(tv, from, scope, s.line);
          while (true) {
            const cur = lookup(scope, s.v).value;
            if (step > 0 ? cur > to : cur < to) break;
            const r = await execBlock(s.body, scope);
            if (r) return r;
            await tick(s, scope);
            await assign(tv, lookup(scope, s.v).value + step, scope, s.line);
          }
          return null;
        }
        case "return": {
          if (!callStack.length) return { t: RETURN, v: undefined, top: true };
          return { t: RETURN, v: s.e ? await getVal(s.e, scope) : undefined };
        }
        case "cls": if (io.clear) io.clear(); return null;
        case "wait": {
          const secs = await getVal(s.e, scope);
          if (typeof secs === "number" && secs > 0) await new Promise((r) => setTimeout(r, Math.min(secs, 5) * 1000));
          return null;
        }
        case "waitkey": return null;
      }
      throw new PseError("Instrucción desconocida", s.line);
    }

    await execBlock(program.main.body, globalScope);
    return { steps, vars: snapshot(globalScope).vars };
  }

  const need = (cond, msg) => { if (!cond) throw new Error(msg); };
  const isNum = (x) => typeof x === "number";
  const BUILTINS = {

  /* ---------------- Resaltado de sintaxis ---------------- */
  const HL_KW = new Set(["algoritmo", "finalgoritmo", "proceso", "finproceso", "definir", "como", "dimension", "dimensionar", "escribir", "imprimir", "mostrar", "leer", "sin", "saltar", "si", "entonces", "sino", "finsi", "segun", "hacer", "caso", "de", "otro", "modo", "finsegun", "mientras", "finmientras", "repetir", "hasta", "que", "para", "con", "paso", "finpara", "funcion", "finfuncion", "subproceso", "finsubproceso", "retornar", "por", "valor", "referencia", "borrar", "pantalla", "esperar", "segundos", "segundo", "tecla", "limpiar"]);

  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  function highlight(src, lang) {

  const JS_KW = new Set(["let", "const", "var", "if", "else", "for", "while", "do", "function", "return", "switch", "case", "break", "default", "continue", "of", "in", "new", "class", "true", "false", "null", "undefined", "typeof", "this"]);

<script>
/* checker.js */
/* Comparación tolerante de salidas para los retos. */
(function (global) {
  "use strict";
  function normLine(s, keepSpaces) {
    let t = s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+$/, "");
    if (!keepSpaces) t = t.replace(/[ \t]+/g, " ").trim();
    return t;
  }
  function lines(s, keepSpaces) {
    return String(s).split("\n").map((l) => normLine(l, keepSpaces)).filter((l) => l.trim() !== "");
  }
  /* exact: toda la salida debe coincidir. Si no, se comparan las últimas líneas (permite mensajes previos). */
  function checkOutput(actual, expected, opts = {}) {
    const a = lines(actual, opts.keepSpaces);
    const e = lines(expected, opts.keepSpaces);
    const tail = opts.exact ? a : a.slice(-e.length);
    if (tail.length !== e.length) return false;
    return tail.every((l, i) => l === e[i]);
  }
  function deepEqual(a, b) {
    return JSON.stringify(a) === JSON.stringify(b);
  }
  global.Checker = { checkOutput, deepEqual, lines };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* jsrunner.js */
/* Ejecuta JavaScript del alumno dentro de un Web Worker (aislado y con límite de tiempo).
   Expone window.JSRunner.run(code, {inputs, tests, timeout}) -> Promise<{out, error, results}> */
(function (global) {
  "use strict";
  const WORKER_SRC = `
  const fmt = (v, top) => {
    if (typeof v === "string") return top ? v : JSON.stringify(v);
    if (v === undefined) return "undefined";
    if (typeof v === "function") return "[función " + (v.name || "anónima") + "]";
    if (Array.isArray(v)) return "[" + v.map((x) => fmt(x, false)).join(", ") + "]";
    if (v && typeof v === "object") {
      try { return "{ " + Object.entries(v).map(([k, x]) => k + ": " + fmt(x, false)).join(", ") + " }"; } catch (e) { return String(v); }
    }
    return String(v);
  };
  self.onmessage = (ev) => {
    const { code, inputs, tests } = ev.data;
    const queue = (inputs || []).slice();
    let out = "";
    const log = (...a) => { out += a.map((x) => fmt(x, true)).join(" ") + "\\n"; if (out.length > 200000) throw new Error("Demasiada salida en consola (¿un bucle infinito?)"); };
    const fakeConsole = { log, info: log, warn: log, error: log };
    const leer = (msg) => { if (msg !== undefined) log(msg); if (!queue.length) throw new Error("El programa pidió un dato con leer()/prompt() pero no hay más entradas"); const v = queue.shift(); return v; };
    let results = null, error = null;
    try {
      const testExprs = (tests || []).map((t) => t.expr ? "(() => { try { return { ok: true, v: (" + t.expr + ") }; } catch (e) { return { ok: false, e: String(e && e.message || e) }; } })()" : "null");
      const body = '"use strict";\\n' + code + "\\n;return [" + testExprs.join(",") + "];";
      const fn = new Function("console", "leer", "prompt", body);
      const raw = fn(fakeConsole, leer, leer);
      results = raw.map((r) => r && (r.ok ? { ok: true, v: fmt(r.v, false), raw: (r.v === undefined ? null : JSON.parse(JSON.stringify(r.v === undefined ? null : r.v))) } : r));
    } catch (e) {
      error = { name: e && e.name, message: String(e && e.message || e), line: lineOf(e) };
    }
    self.postMessage({ out, error, results });
  };
  function lineOf(e) {
    const m = String(e && e.stack || "").match(/<anonymous>:(\\d+):(\\d+)/);
    return m ? Number(m[1]) - 3 : null;
  }`;

  let url = null;
  function workerURL() {
    if (!url) url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
    return url;
  }

  const TRANSLATE = [
    [/(\w+) is not defined/, (m) => "'" + m[1] + "' no está definido. ¿Lo escribiste bien o falta declararlo con let/const?"],
    [/Unexpected end of input/, () => "El código termina antes de tiempo: probablemente falta cerrar una llave } o un paréntesis )"],
    [/Unexpected token '?(.+?)'?$/, (m) => "Símbolo inesperado " + m[1] + ". Revisa paréntesis, llaves y comas cerca de ahí"],
    [/Unexpected identifier '?(.+?)'?$/, (m) => "Nombre inesperado '" + m[1] + "'. ¿Falta una coma, un operador o un paréntesis antes?"],
    [/Assignment to constant variable/, () => "Intentaste cambiar una constante (const). Usa let si el valor debe cambiar"],
    [/Cannot read properties of (undefined|null) \(reading '(.+)'\)/, (m) => "Intentaste leer '." + m[2] + "' de algo que es " + m[1] + ". Revisa que la variable tenga valor"],
    [/(.+) is not a function/, (m) => m[1] + " no es una función. Revisa el nombre o los paréntesis"],
    [/Invalid or unexpected token/, () => "Hay un carácter no válido. ¿Comillas sin cerrar o comillas tipográficas “ ”?"],
    [/missing \) after argument list/, () => "Falta cerrar un paréntesis ) en la llamada a una función"],
    [/Identifier '(.+)' has already been declared/, (m) => "'" + m[1] + "' ya fue declarado. Declara cada variable una sola vez con let/const"],
    [/Cannot access '(.+)' before initialization/, (m) => "Usaste '" + m[1] + "' antes de declararla"],
  ];
  function explain(msg) {
    for (const [re, f] of TRANSLATE) { const m = msg.match(re); if (m) return f(m); }
    return msg;
  }

  function run(code, opts = {}) {
    return new Promise((resolve) => {
      let w;
      try { w = new Worker(workerURL()); }
      catch (e) { resolve({ out: "", error: { message: "No se pudo iniciar el ejecutor de JavaScript en este navegador" }, results: null }); return; }
      const timer = setTimeout(() => {
        w.terminate();
        resolve({ out: "", error: { message: "Tu programa tardó demasiado (más de " + ((opts.timeout || 3000) / 1000) + " s). ¿Hay un bucle infinito?" }, results: null, timeout: true });
      }, opts.timeout || 3000);
      w.onmessage = (ev) => {
        clearTimeout(timer); w.terminate();
        const r = ev.data;
        if (r.error) r.error.friendly = explain(r.error.message);
        resolve(r);
      };
      w.onerror = (ev) => {
        clearTimeout(timer); w.terminate();
        ev.preventDefault && ev.preventDefault();
        resolve({ out: "", error: { message: ev.message, friendly: explain(String(ev.message || "").replace(/^Uncaught \w+: /, "")) }, results: null });
      };
      w.postMessage({ code, inputs: opts.inputs || [], tests: opts.tests || [] });
    });
  }

  global.JSRunner = { run, explain };
})(window);

</script>
